home=function(){let s=stats(),next=DATA.tests.find(x=>!s.unique.has(x.id))?.id||1;return `<section class="hero"><div><div class="eyebrow">GRADE 4 · EVELYN'S ELPAC STUDY LAB</div><h1>${zh()?'學會英文，再挑戰 ELPAC':'Learn first. Practice with confidence.'}</h1><p>${zh()?'包含聽、說、讀、寫四大能力；循序自主學習與 200 份計時測驗。':'Read, listen, write, and speak with guided lessons and 200 timed practice tests.'}</p><div class="actions"><button class="bigbtn" data-action="learning">🌿 ${tx('learnNow')}</button><button class="darkbtn" data-action="ready" data-id="${next}">▶ ${tx('tryQuiz')}</button>${db.active?`<button class="darkbtn" data-action="resume">⏱ ${tx('resume')}</button>`:''}</div></div><div class="heroArt"><div class="orb"></div><div class="paper"><div class="pill">🎧 📚 ✍️ 🎤</div><h3>ELPAC · GRADE 4</h3><div class="rule"></div><div class="rule"></div><div class="rule"></div><b>200 Tests + 40 Courses</b></div></div></section>${db.active?`<div class="notice">⏱ ${esc(t('activeMessage'))} <button class="primary" data-action="resume">${tx('resume')}</button></div>`:''}
<div class="sectionHead"><div><h2>${tx('practiceTypes')}</h2><p>${tx('offline')}</p></div></div><div class="domainGrid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="domainCard"><div class="domainEmoji">🌿</div><h3>${tx('learning')}</h3><p>${tx('learnDesc')}<br>${tx('studyExplain')}</p><button class="primary" data-action="learning">${tx('learnNow')} →</button></div><div class="domainCard"><div class="domainEmoji">🏅</div><h3>${tx('testCurr')}</h3><p>100 ${tx('coreTests')} + 100 ${tx('mixTests')}<br>${tx('scoreNote')}</p><button class="primary" data-action="curriculum">${tx('allTests')} →</button></div></div><div class="sectionHead"><h2>${tx('progressDash')}</h2><button class="textbtn" data-action="progress">${esc(t('yourProgress'))} →</button></div><div class="stats"><div class="stat"><div class="num">${s.unique.size}/200</div><div class="meta">${tx('tests')} ${tx('done')}</div></div><div class="stat"><div class="num">${s.avg}%</div><div class="meta">${esc(t('average'))}</div></div><div class="stat"><div class="num">${allLearnStats().uniqueDone}/40</div><div class="meta">${tx('courses')} ${tx('done')}</div></div><div class="stat"><div class="num">${allLearnStats().done}</div><div class="meta">${tx('finishedRuns')}</div></div></div><div class="actions"><button class="secondary" data-action="learning">${tx('learnNow')}</button><button class="secondary" data-action="curriculum">${tx('allTests')}</button></div>`};
function progressTable(){return `<div class="simpleCard"><h3>${tx('learnStats')} · ${tx('courses')}</h3><div style="overflow:auto"><table class="tableWide"><thead><tr><th>${tx('courses')}</th><th>${tx('visit')}</th><th>${tx('activities')}</th><th>${tx('finishedRuns')}</th></tr></thead><tbody>${STUDY_COURSES.map(x=>{let r=learnRec(x.id);return `<tr><td>${x.id} ${esc(x.title)}</td><td>${r.opens}</td><td>${r.done.length}/6</td><td>${r.completedRuns}</td></tr>`}).join('')}</tbody></table></div><button class="secondary noPrint" data-action="exportLearn">↓ Export self-paced CSV</button></div>`}
progressPage=function(){let s=stats();return `<div class="pathHeader"><h1>${tx('progressDash')}</h1><p>${tx('offline')}</p></div><div class="sectionHead"><h2>${tx('testCurr')}</h2></div><div class="stats"><div class="stat"><div class="num">${s.unique.size}/200</div><div class="meta">${tx('done')}</div></div><div class="stat"><div class="num">${s.h.length}</div><div class="meta">${esc(t('attempts'))}</div></div><div class="stat"><div class="num">${s.avg}%</div><div class="meta">${esc(t('average'))}</div></div><div class="stat"><div class="num">${s.best}%</div><div class="meta">${esc(t('best'))}</div></div></div><div class="simpleCard"><h3>${esc(t('history'))}</h3><div style="overflow:auto"><table class="tableWide"><thead><tr><th>${tx('test')}</th><th>${esc(t('resultDate'))}</th><th>${tx('score')}</th><th>${tx('answered')}</th></tr></thead><tbody>${s.h.slice().reverse().slice(0,50).map(x=>`<tr><td>TEST ${qfmt(x.testId)}</td><td>${new Date(x.finishedAt).toLocaleDateString()}</td><td>${x.score}%</td><td>${x.answered}/20</td></tr>`).join('')}</tbody></table></div><div class="actions noPrint"><button class="secondary" data-action="export">↓ Export scores CSV</button>${db.last?`<button class="secondary" data-action="last">${esc(t('lastResult'))}</button>`:''}<button class="textbtn" data-action="reset">${esc(t('reset'))}</button></div></div><div class="sectionHead"><h2>${tx('learnStats')}</h2></div>${renderStudyStats()}${progressTable()}`};
guide=function(){return `<div class="pathHeader"><h1>${esc(t('guide'))}</h1><p>${zh()?'官方 ELPAC 題型參考與本地訓練器的功能說明。':'Official ELPAC references and a practical guide to this offline learning app.'}</p></div><div class="guideGrid"><div class="guideCard"><h3>🪜 ${tx('learning')}</h3><p>40 ${tx('courses')} × 6 ${tx('activities')} = <b>240</b> ${zh()?'原創教學活動。':'original guided activities.'}</p><p>${tx('studyExplain')} ${tx('untimed')}</p><p>${zh()?'每次開啟課程、每一活動閱讀次數及每一輪完成都會記錄。':'Each course visit, topic view, and completed round is counted locally.'}</p></div><div class="guideCard"><h3>🏅 ${tx('testCurr')}</h3><p>001–100: 18 ${tx('reading')} MC + 2 ${tx('writing')} · 20 min.</p><p>101–200: 8 ${tx('reading')} MC + 8 ${tx('listening')} MC + 2 ${tx('writing')} + 2 ${tx('speaking')} · 30 min.</p><p>${tx('scoreNote')} ${zh()?'未完成的題目以 0 分計。':'Unanswered items earn zero.'}</p></div><div class="guideCard"><h3>🎧 ${tx('listening')} / 🎤 ${tx('speaking')}</h3><p>${tx('listenNote')}</p><p>${tx('noAutoVoice')}</p><p>${tx('recordingHelp')}</p></div><div class="guideCard"><h3>📚 ${zh()?'加州教育標準':'California Standards'}</h3><p><a href="https://www.caaspp-elpac.org/resources/preparation/practice-and-training-tests" target="_blank" rel="noopener">Official CAASPP/ELPAC student guest practice</a></p><p><a href="https://www.caaspp-elpac.org/resources/preparation/practice-and-training-tests/practice-and-training-resources" target="_blank" rel="noopener">ELPAC grade-span 3–5 scoring guides &amp; tasks</a></p><p><a href="https://www.cde.ca.gov/SP/ml/eldstandards.asp" target="_blank" rel="noopener">California ELD Standards</a></p><p><a href="https://www.thecorestandards.org/ELA-Literacy/RI/4/" target="_blank" rel="noopener">CCSS Grade 4 Reading Informational Text</a></p><p><a href="https://www.thecorestandards.org/ELA-Literacy/W/4/" target="_blank" rel="noopener">CCSS Grade 4 Writing</a></p></div><div class="guideCard"><h3>🎨 ${zh()?'圖片與版權':'Illustrations & image rights'}</h3><p>${zh()?'240 個自主學習活動各有不同的主題相關 SVG 原創插圖，離線也能顯示；部分太空課另附需連線顯示的 NASA 圖片。':'Each of the 240 learning activities includes its own topic-related original SVG illustration that works offline. Selected space lessons optionally show a NASA government photo online.'}</p><p><a href="https://science.nasa.gov/resource/the-blue-marble/" target="_blank" rel="noopener">NASA, Apollo 17 — The Blue Marble</a></p><p><a href="https://www.nasa.gov/nasa-brand-center/images-and-media/" target="_blank" rel="noopener">NASA image usage guidelines</a></p></div><div class="guideCard"><h3>🔐 ${zh()?'家長提醒':'Parent notes'}</h3><p>${tx('offline')}</p><p>${tx('manual')}</p><p>${zh()?'分數 80% 只是這個練習程式自訂門檻，不能等同正式 ELPAC 等級或重分類條件。':'80% is a household practice goal, NOT an official ELPAC score, performance level, or reclassification rule.'}</p><p>${zh()?'為避免兒童聲音資料外流，錄音不會上傳，亦不永久儲存；會話內容請勿包含個資。':'Speech recordings never upload and do not persist. Avoid sharing personal details in responses.'}</p></div></div>`};
const oldRender=render;
render=function(){if(db.active&&remaining()<=0){finish(true);return}document.documentElement.lang=zh()?'zh-Hant':'en';let content=ui.screen==='learning'?learningHome():ui.screen==='learnCourse'?learningCourse():ui.screen==='quiz'?quiz():ui.screen==='ready'?ready():ui.screen==='result'?result():ui.screen==='curriculum'?curriculum():ui.screen==='progress'?progressPage():ui.screen==='guide'?guide():home();$('app').innerHTML=topNav()+content+footer()};
// The legacy delegated click handler ignores the new action values. Handle them here.
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let act=el.dataset.action;
 if(act==='learning'){if(window.speechSynthesis)speechSynthesis.cancel();ui.screen='learning';render();window.scrollTo(0,0)}
 else if(act==='learnDomain'){learnUI.mode=el.dataset.domain;ui.screen='learning';render();document.querySelector('details.learnUnit[open]')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
 else if(act==='learnCourse'){openLearn(el.dataset.id)}
 else if(act==='learnTopic'){moveLearn(Number(el.dataset.index))}
 else if(act==='prevLearn'){moveLearn(learnUI.index-1)}
 else if(act==='nextLearn'){moveLearn(learnUI.index+1)}
 else if(act==='chooseLearn'){learnUI.selected=Number(el.dataset.option);render()}
 else if(act==='showLearn'||act==='checkLearn'){learnUI.showResult=true;render()}
 else if(act==='markLearn'){markLearn()}
 else if(act==='restartLearn'){restartLearn()}
 else if(act==='transcript'){learnUI.showTranscript=!learnUI.showTranscript;render()}
 else if(act==='voicePreview'){speakText("On Monday, Lily spotted a blue butterfly in the garden. 'Where will it land next?' she wondered. Her brother smiled and pointed toward the flowers.")}
  else if(act==='stopAudio'){stopAudio()}
  else if(act==='learnPlay'){let c=STUDY_COURSES.find(x=>x.id===learnUI.course);speakText(c.items[learnUI.index].script,false)}
 else if(act==='examPlay'){let a=db.active,q=activeQuestion();if(!a||q?.domain!=='listening')return;a.plays=a.plays||{};let n=a.plays[q.id]||0;if(n<2&&speakText(q.script)){a.plays[q.id]=n+1;persist();render()}}
 else if(act==='record'){startRecording()}
 else if(act==='stopRecord'){stopRecording()}
 else if(act==='exportLearn'){let rows=[['Course','Domain','Title','Course opens','Current round done / 6','Completed rounds','Last opened'],...STUDY_COURSES.map(x=>{let r=learnRec(x.id);return [x.id,x.domain,x.title,r.opens,r.done.length,r.completedRuns,r.last?new Date(r.last).toISOString():'']})];let csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Evelyn_ELPAC_Self_Paced_Progress.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
});
document.addEventListener('input',e=>{if(e.target.id==='learnDraft'){let key=learnUI.course+'-'+learnUI.index;db.learn.drafts[key]=e.target.value;persist()}});
setInterval(()=>{let x=$('moretimefill');if(x&&db.active)x.style.width=(remaining()/(db.active.deadline-db.active.startedAt)*100).toFixed(1)+'%'},500);
render();

</script>
