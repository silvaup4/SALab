.feedbackBox{padding:17px;margin:16px 0;border-radius:12px;background:#f1f9f5;border:1px solid #c7e5d6}.feedbackBox.bad{background:#fff5ef;border-color:#f0d5bc}.feedbackBox h4{margin:0 0 8px}.feedbackBox p{margin:7px 0}.learningNav{border-top:1px solid #dfebe7;padding-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.sceneArt{max-width:620px;margin:14px auto 18px;border-radius:17px;border:1px solid #d7eae5;overflow:hidden}.sceneArt svg{display:block;width:100%;height:auto}.realPhoto{max-width:330px;border-radius:14px;display:block;width:100%;margin:12px auto}.photoCredit{font-size:11px;text-align:center;color:#648089}
.audioNotice{font-size:12px;color:#647986;padding:7px 0}
.meter{height:9px;background:#e0ebe8;border-radius:20px;overflow:hidden}.meter span{display:block;background:#0e847c;height:100%}
.twoActions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.answerPick{display:flex;text-align:left;align-items:center;gap:10px;padding:13px;border:1px solid #d7e7e1;background:white;border-radius:12px;width:100%;margin:8px 0;color:#254657}.answerPick.selected{border-color:#168678;background:#eaf9f3;font-weight:700}.answerPick span:first-child{display:grid;place-items:center;border-radius:9px;background:#eaf5ee;min-width:29px;height:29px;font-weight:900}
.examDomain{font-size:12px;font-weight:900;letter-spacing:.6px;color:#0e766c;text-transform:uppercase}.examTranscript{padding:15px;background:#f5faf8;border-radius:12px;color:#48606b;font-size:13px}
.recordingControls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.recordingControls audio{width:100%;max-width:350px}
.integratedGuide{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.integratedGuide>div{padding:12px;background:#f4f9f6;border-radius:12px;text-align:center}.integratedGuide b{font-size:22px;color:var(--navy)}.integratedGuide small{display:block;font-size:11px;color:#5c7982}
.tableWide{width:100%;border-collapse:collapse}.tableWide td,.tableWide th{padding:9px;text-align:left;border-bottom:1px solid #e1eae5;font-size:13px}
@media(max-width:990px){.domainGrid{grid-template-columns:repeat(2,1fr)}.learningLayout{grid-template-columns:1fr}.learningSide{position:static;order:-1;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.learningSide h4,.learningSide p{grid-column:1/-1}.learningSide .topicBtn{margin:0}}
@media(max-width:650px){.learningPaper,.learningSide{padding:17px}.learnUnit .learnRow{grid-template-columns:1fr auto}.learnUnit .learnRow .tiny{grid-column:1/-1}.integratedGuide{grid-template-columns:repeat(2,1fr)}.domainGrid{grid-template-columns:1fr}.learningHero{padding:22px}.learningSide{grid-template-columns:1fr}.top .nav{flex-wrap:wrap}.top .nav button{flex:1 1 30%}}
@media print{.learningSide,.learnSteps button,.learningNav,.learnUnit{display:none}.learningLayout{display:block}.learningPaper{box-shadow:none;border:0}}


/* V3 visual lesson cards, feedback, and accessible distinct answer states */
.lessonPicture{display:block;max-width:620px;margin:18px auto 23px;border-radius:18px;overflow:hidden;border:1px solid #d6e8e2;background:#eff6f5;box-shadow:0 10px 25px rgba(31,69,76,.07)}

.answerPick.correctReveal>span:first-child{background:#168655!important;color:white!important}

/* V4: Natural voice controls, responsive voice selection, and audio state. */
.audioTuning{display:flex;gap:9px 13px;align-items:end;flex-wrap:wrap;background:#f6faf9;border:1px solid #d8e9e5;border-radius:13px;padding:13px;margin:11px 0 17px}

.audioTuning .audioButtons{display:flex;gap:7px;flex-wrap:wrap}
.audioTuning .audioButtons button{padding:10px 13px;min-height:39px}

@media(max-width:650px){.audioTuning label,.audioTuning label:first-child{min-width:100%;flex:1}.audioTuning .audioButtons{width:100%}}
