hanges Sasha’s experience of time.","detail":["What was Sasha preparing for?","A spelling contest","A swimming race","A piano recital","A science museum visit","Sasha was practicing words before the spelling contest."],"cause":["Why did the clock seem fast at first?","Sasha was nervous about the contest","The clock had a broken battery","The teacher made time move faster","The class skipped an entire hour","Anxiety made Sasha notice each tick more strongly."],"infer":["What does “the clock had slowed down” mean?","Sasha felt calmer after a successful start","The clock stopped working","The contest was postponed","Her brother repaired the clock","Her sense of time changed when she relaxed."],"vocab":["faded","became less noticeable","grew much louder","turned bright red","started moving backward"],"concepts":[["clock","time","tick"],["nervous","contest","spelling"],["calm","relax","emotion"]]},{"level":4,"title":"Grandpa’s Bent Spoon","genre":"Literary","paragraphs":["In the kitchen drawer, Wren found an old spoon with a bent handle. She offered to throw it away, but Grandpa asked her to keep it. He explained that the spoon had belonged to the tiny diner where he worked as a teenager.","One winter morning, the diner owner had used the spoon to stir a huge pot of soup for neighbors stranded by snow. Grandpa had helped serve bowls until everyone was warm. The spoon had bent during the busy day.","Wren placed the spoon back carefully. What had looked like a useless object now seemed like a reminder of people helping one another."],"main":"A worn spoon reminds a family of generosity during a winter storm.","detail":["Where had Grandpa worked as a teenager?","At a diner","At an airport","At a museum","At a school library","Grandpa said the spoon came from the diner where he worked."],"cause":["Why was the spoon bent?","It was used while serving a large pot of soup","Wren sat on it that morning","It was caught in a bicycle wheel","It melted in sunlight","The handle bent during a busy day of preparing soup."],"infer":["Why did Wren change her mind about the spoon?","She learned the meaningful story behind it","She discovered that it was made of gold","She decided she disliked soup","Grandpa bought a new spoon","The spoon represented kindness, making its history more important than its damage."],"vocab":["stranded","unable to leave a place safely","ready to begin a race","very excited about a party","covered with colorful paint"],"concepts":[["spoon","diner","soup"],["snow","neighbors","help"],["memory","kindness","meaning"]]},{"level":4,"title":"The Window Garden","genre":"Literary","paragraphs":["For months, June had lived in an apartment without a yard. She missed the flowers that grew beside her old home. Her new room had only a wide window facing the morning sun.","One weekend, June arranged three small pots on the sill. She planted mint, marigolds, and a bean seed. Each morning, she checked the soil and turned the pots so the stems would not lean too far toward the light.","When the first orange marigold opened, June smiled. The window had not become a yard, but she had found a way to bring a little of her old home into the new one."],"main":"June creates a small garden that helps her feel at home in a new place.","detail":["Where did June grow her new plants?","On a sunny windowsill","In a school gym","Inside a dark closet","In a swimming pool","June placed three pots on the window ledge."],"cause":["Why did June turn the pots?","So the stems would grow more evenly toward light","To keep the soil from touching water","To stop every plant from flowering","To hide them from the window","Plants tend to lean toward a light source, so rotating pots can help."],"infer":["What did the first marigold likely mean to June?","A connection to her old home and a fresh start","Proof she no longer needed sunlight","A reason to move again immediately","A sign that plants never need care","The flower reminded her of her old yard while improving her new home."],"vocab":["sill","the flat bottom edge of a window","a long garden hose","a kind of orange flower","a notebook for drawing maps"],"concepts":[["apartment","window","pots"],["flower","marigold","garden"],["home","memory","new"]]},{"level":5,"title":"Should the School Start Later?","genre":"Opinion and evidence","paragraphs":["The student council asked whether school should start thirty minutes later. Some students argued that extra morning time would help them arrive less rushed. A few parents said later mornings could make breakfast and transportation easier.","Other families worried that a later ending time would conflict with sports or work schedules. The principal collected responses from students, families, and teachers before making a recommendation.","The council learned that a strong proposal should explain its benefits, recognize possible problems, and use information from the people affected."],"main":"A fair school-start proposal considers advantages, disadvantages, and community input.","detail":["What concern did some families express?","A later ending time could conflict with schedules","Students would forget how to read clocks","Breakfast would no longer exist","The school building would be moved","Families worried about conflicts with sports and work."],"cause":["Why did the principal collect responses from several groups?","Different groups could be affected in different ways","Only one group knew the school address","The council wanted to avoid all opinions","Every family follows the same schedule","Gathering multiple perspectives helps evaluate a policy fairly."],"infer":["Which argument would make the proposal stronger?","Evidence about student needs and schedule trade-offs","A statement that every person already agrees","A list of favorite cafeteria foods","A claim with no examples or reasons","A balanced recommendation needs relevant evidence and consideration of costs."],"vocab":["proposal","a plan suggested for others to consider","a report about yesterday’s weather","a tool used to dig a hole","a promise that cannot be changed"],"concepts":[["school","start","time"],["families","students","teachers"],["benefits","problems","evidence"]]},{"level":5,"title":"The Ocean Cleanup Claim","genre":"Evaluating information","paragraphs":["A poster at a community event announced, “One beach cleanup will solve ocean pollution!” Several fourth graders liked the excitement of the message, but their teacher asked them to examine the word “solve.”","Cleaning a beach can remove harmful litter from one area. However, trash also enters the ocean through rivers and streets, and new waste can arrive after a cleanup. Long-term improvement may require reducing trash, better disposal, and many cleanups.","The students revised the poster to say, “One cleanup makes a difference. Many actions protect the ocean.” The new claim was both hopeful and more accurate."],"main":"A good environmental claim recognizes both the value and limits of a single cleanup.","detail":["What did the students change on the poster?","The claim that one cleanup would solve all ocean pollution","The location of the community event","The date of the school holiday","The price of swimming lessons","The revised message acknowledged the limits of one cleanup."],"cause":["Why was the original poster’s promise too strong?","Trash can continue entering oceans from many places","Beach litter does not exist","Cleanups always create more trash than they remove","Rivers carry only clean water","The passage shows that pollution has continuing sources."],"infer":["What is the strongest conclusion?","A cleanup helps but must be part of a larger effort","A single cleanup removes all future pollution","Cleaning beaches has no value","Only posters can improve oceans","The revision balances meaningful action with realistic limits."],"vocab":["accurate","correct and supported by facts","extremely colorful","very short without meaning","impossible to understand"],"concepts":[["cleanup","beach","litter"],["trash","rivers","ocean"],["claim","limits","accurate"]]},{"level":5,"title":"When Graphs Need Labels","genre":"Informational","paragraphs":["A school newspaper printed a bar graph comparing how many students used the library in September and October. At first glance, the October bar looked twice as tall. But the graph did not show numbers along its side.","When the editor asked for the original totals, she found that 80 students visited in September and 100 visited in October. Visits had increased, but they had not doubled.","The editor added a numbered vertical scale and clear labels. Readers could now see the real difference instead of relying only on the size of the bars."],"main":"Accurate graph labels help readers understand data without being misled.","detail":["How many students visited the library in October?","100","80","160","200","The original totals were 80 in September and 100 in October."],"cause":["Why was the first graph misleading?","It lacked a scale to show the actual numbers","The library had no visitors","The newspaper used ordinary paper","The graph showed two months","Without a numbered scale, the bar heights could exaggerate the change."],"infer":["What should a careful reader do when a graph has no scale?","Ask for the numbers before drawing a conclusion","Assume the tallest bar means twice as much","Ignore the title and labels","Believe every visual proportion automatically","Missing labels make it difficult to interpret the true size of differences."],"vocab":["scale","numbers that show how a graph measures values","a list of school lunch items","a musical instrument","a kind of library shelf"],"concepts":[["graph","bars","scale"],["September","October","visits"],["labels","numbers","accurate"]],"visual":{"kind":"bars","title":"Library Visits by Month","labels":["September","October"],"values":[80,100],"question":"How many more students visited in October than September?","correct":"20 more students","wrong":["80 more students","100 more students","Visits doubled"],"explain":"100 minus 80 equals 20. October did not have twice as many visits."}},{"level":5,"title":"The Best Route to School","genre":"Comparative informational","paragraphs":["Siblings Kai and Ada compared two walking routes to school. Route A was shorter, but it required crossing a busy street without a traffic light. Route B took five extra minutes and included a marked crossing with a signal.","They walked both routes with an adult and observed the conditions. On Route B, they also noticed a wide sidewalk and a crossing guard during the morning rush.","They chose Route B for their regular trip. The siblings explained that the quickest option was not automatically the safest one. The siblings chose safety over a few minutes of convenience."],"main":"Kai and Ada choose a slightly longer route because it has safer crossings.","detail":["How much longer did Route B take?","Five minutes","One hour","Thirty minutes","Two seconds","Route B added five minutes to the walk."],"cause":["Why did they choose Route B?","It had a signal, a wide sidewalk, and a crossing guard","It avoided all walking","It had no marked crossings","It was the shortest route","The safety features outweighed the small extra time."],"infer":["Which principle does their choice illustrate?","Decisions should weigh safety as well as convenience","The fastest route is always best","Every busy street is easy to cross","A route map can replace looking at traffic","The siblings compared trade-offs rather than choosing only by travel time."],"vocab":["convenience","how easy or useful something is","a rule for measuring weight","a kind of traffic signal","a large building"],"concepts":[["route","school","walk"],["crossing","guard","signal"],["safety","time","choice"]],"visual":{"kind":"bars","title":"Walking Time to School (minutes)","labels":["Route A","Route B"],"values":[12,17],"question":"Which route takes five minutes longer?","correct":"Route B","wrong":["Route A","Both take the same time","Neither route takes time"],"explain":"Route A takes 12 minutes and Route B 17, a difference of 5 minutes."}},{"level":5,"title":"An Advertisement for the Garden","genre":"Persuasive informational","paragraphs":["The gardening club designed a flyer inviting families to volunteer on Saturday. Its first draft said only, “Come to the garden.” Few students could tell what they were expected to do or when they should arrive.","The revised flyer explained that volunteers would plant seedlings from 9 to 11 a.m., that tools would be provided, and that families could bring reusable water bottles. It also included a cheerful picture of students working together.","The club learned that persuasive writing is more effective when readers have clear reasons and practical details for taking action."],"main":"An effective invitation combines an appealing message with specific useful details.","detail":["What time would volunteers plant seedlings?","9 to 11 a.m.","6 to 8 p.m.","At midnight","Only after the school day","The revised flyer states the 9–11 a.m. volunteer time."],"cause":["Why was the first flyer less effective?","It did not explain tasks or timing","It contained too many accurate details","It offered tools to volunteers","It included a picture of helpers","Readers needed practical information before deciding to attend."],"infer":["What would most improve a vague event invitation?","Adding the activity, time, and what to bring","Removing the event location","Claiming everyone must attend","Using only a decorative picture","Useful details answer readers’ likely questions and encourage action."],"vocab":["persuasive","intended to convince someone","designed to measure rain","unable to include words","written only for scientists"],"concepts":[["flyer","garden","volunteer"],["time","tools","details"],["invitation","persuasive","clear"]]},{"level":5,"title":"The Mystery of the Shorter Shadow","genre":"Scientific reasoning","paragraphs":["At 9 a.m., a class measured the shadow of a flagpole. At noon, they returned and found that its shadow was shorter. At 3 p.m., the shadow was longer again, but it pointed in a different direction.","A student guessed that the flagpole was shrinking during the day. The teacher asked whether anyone had observed the pole itself changing. They had not. Instead, the class discussed how the Sun’s position in the sky changes the direction and length of shadows.","The investigation reminded students that a changing measurement does not always mean the object being measured has changed."],"main":"Changes in the Sun’s position explain shadow lengths, not a shrinking flagpole.","detail":["When did the class observe the shortest shadow?","At noon","At 9 a.m.","At 3 p.m.","At midnight","The noon shadow was shorter than the morning and afternoon shadows."],"cause":["Why did the teacher challenge the shrinking-pole idea?","No one had evidence that the pole itself changed","All shadows remain the same size","Flagpoles always grow each afternoon","Students were not allowed to measure","The teacher separated an observation from an unsupported explanation."],"infer":["What is the strongest inference?","The apparent Sun position affects shadow size and direction","Flagpoles change height every few hours","Shadows are made of solid wood","Only short objects cast shadows","A fixed pole produced different shadows as the Sun’s angle changed."],"vocab":["investigation","a careful effort to find out how something works","a long musical performance","a kind of math ruler","a place where books are borrowed"],"concepts":[["shadow","flagpole","measure"],["sun","position","noon"],["evidence","explanation","change"]],"visual":{"kind":"bars","title":"Flagpole Shadow Length (cm)","labels":["9 a.m.","Noon","3 p.m."],"values":[80,35,70],"question":"About how long was the flagpole shadow at noon?","correct":"35 cm","wrong":["80 cm","70 cm","100 cm"],"explain":"The bar labeled Noon reaches 35 centimeters."}},{"level":5,"title":"Can a Headline Mislead?","genre":"Media literacy","paragraphs":["A headline on the school website said, “Students Hate the New Lunch Menu!” The article beneath it reported that twelve students had been interviewed. Seven preferred the old menu, three liked the new menu, and two had no preference.","Nadia noticed that seven students did not represent every student at the school. She suggested a more careful headline: “Some Students Prefer the Old Lunch Menu.” The editor changed the title.","The story showed how a headline can make a small survey sound like a fact about an entire community."],"main":"A headline should accurately describe limited survey evidence instead of overgeneralizing.","detail":["How many interviewed students preferred the old menu?","Seven","Three","Two","Twelve","Seven out of twelve interviewed students preferred the old menu."],"cause":["Why was the first headline misleading?","It suggested all students shared the same opinion","It used the word “menu”","It included an exclamation mark","It reported that interviews occurred","A small sample with mixed opinions cannot prove every student hates the menu."],"infer":["Why is Nadia’s headline stronger?","It limits the statement to some students","It claims nobody enjoys lunch","It hides the survey entirely","It says all students were interviewed","“Some” correctly reflects the evidence without exaggeration."],"vocab":["survey","questions asked to gather people’s opinions or information","a device for measuring sound","a kind of classroom chair","a drawing of a forest"],"concepts":[["headline","menu","students"],["survey","twelve","seven"],["some","accurate","evidence"]],"visual":{"kind":"bars","title":"Student Lunch Survey (12 Interviews)","labels":["Old menu","New menu","No preference"],"values":[7,3,2],"question":"How many interviewed students preferred the new menu?","correct":"3 students","wrong":["7 students","2 students","12 students"],"explain":"The New menu bar shows 3 interviewed students."}},{"level":5,"title":"A Park for Everyone","genre":"Civic informational","paragraphs":["The city planned a playground renovation. A group of students suggested adding a climbing wall, but a parent pointed out that some children use wheelchairs and might not be able to reach all the equipment.","The planners explored ramps, wide pathways, and play panels that children could use from different heights. These changes would not make every activity identical, but they could create more ways for children to play together.","The final plan included both climbing challenges and accessible features. The planning team said good design begins by considering many kinds of users. The planners hoped this inclusive design would welcome more children."],"main":"Inclusive playground design offers ways for children with different needs to participate.","detail":["Which feature was considered for better accessibility?","Wide pathways and ramps","A taller fence with no gate","Narrower entrances","Stairs to every play area","Planners discussed ramps and wide pathways."],"cause":["Why did the team change its first proposal?","It had not considered all children’s access needs","The climbing wall was too colorful","No children wanted to play outdoors","The city stopped funding all parks","Feedback highlighted children who might not reach some equipment."],"infer":["What does the final design suggest?","Good solutions can include varied ways to participate","Every child must use equipment in one way","Accessibility means removing all challenges","Only adults should make playground decisions","The plan combined climbing with accessible features to serve more children."],"vocab":["inclusive","welcoming people with different needs","designed for exactly one person","finished much earlier than planned","easy to carry in a backpack"],"concepts":[["playground","park","equipment"],["ramps","paths","wheelchair"],["inclusive","access","everyone"]]},{"level":5,"title":"The Two Weather Forecasts","genre":"Critical reading","paragraphs":["On Friday, two websites predicted Saturday’s weather. One forecast called for sunshine, while the other predicted a chance of showers. Darius wanted to plan a family picnic and wondered which forecast to trust.","His mother showed him that forecasts are predictions based on changing information. They compared the latest updates and looked at the hour-by-hour outlook. On Saturday morning, they checked again before leaving.","They brought a light rain jacket but still enjoyed their picnic. Darius learned that uncertainty can be managed by checking sources and preparing for more than one outcome."],"main":"Weather forecasts contain uncertainty, so updated information and preparation matter.","detail":["What were the two forecasts predicting?","Sunshine versus a chance of showers","Snow versus a heat wave","A tornado versus an earthquake","The same weather in every hour","One site predicted sunshine and the other possible showers."],"cause":["Why did the family check the forecast again on Saturday?","Predictions can change as new information arrives","Weather websites never update","They wanted to cancel every plan","Rain jackets cannot be carried outside","Checking fresh information helped them prepare realistically."],"infer":["What is a sensible response to an uncertain forecast?","Look at updated information and bring suitable gear","Assume the first forecast must be correct","Ignore changing conditions completely","Stop all outdoor activities forever","The family kept its plan while preparing for a possible shower."],"vocab":["uncertainty","not knowing exactly what will happen","knowing every detail in advance","a loud sound in the sky","the length of a picnic table"],"concepts":[["forecast","weather","prediction"],["update","check","sources"],["prepare","jacket","uncertain"]]},{"level":5,"title":"A Better Science Question","genre":"Scientific reasoning","paragraphs":["For the school fair, two students wanted to investigate which paper towel absorbed the most water. Their first plan was to use different-sized sheets of three brands and pour different amounts of water on each.","The teacher asked how they could tell whether the results came from the towel brand or from the amount of water. The students revised the plan: each sample would have the same size and receive the same amount of water.","They repeated each trial and recorded the results in a table. Their improved question became, “Under the same conditions, which towel absorbs the most?” The students kept these controlled conditions in every trial."],"main":"A fair comparison controls conditions so a test can answer one question.","detail":["What did the students keep the same in the revised experiment?","Sheet size and amount of water","Towel color and room decorations","All towels’ brand names","The number of students in school","The revised procedure used equal sheet sizes and water amounts."],"cause":["Why was the original experiment unfair?","Several conditions changed at once","It included only paper towels","The classroom was too quiet","The towels were made of paper","Different sizes and water amounts could affect the outcome independently of brand."],"infer":["What would make the results more trustworthy?","Repeating controlled trials and recording data","Changing the measurements each time","Choosing a winner before testing","Testing only the most expensive brand","Repeated trials under equal conditions make comparisons more reliable."],"vocab":["controlled","kept consistent or carefully managed","chosen by flipping a coin","moved to a different city","hidden from the researcher"],"concepts":[["experiment","towel","water"],["same","size","amount"],["fair","trial","repeat"]]},{"level":5,"title":"The Community Solar Project","genre":"Evaluating proposals","paragraphs":["A town considered placing solar panels on the roof of its recreation center. Supporters said panels could produce some electricity during sunny hours. They also noted that the large roof received sunlight for much of the day.","Other residents asked about installation costs, maintenance, and what would happen on cloudy days. Engineers explained that the building would still need an electrical connection when the panels were not producing enough power.","The town decided to study costs and expected energy savings before making a final choice. Both possible benefits and limitations belonged in the decision."],"main":"A solar-panel decision requires comparing energy benefits with costs and limits.","detail":["Where were the proposed panels to be installed?","On the recreation center roof","Under the town swimming pool","Inside a school hallway","Across the public library doors","The plan called for rooftop solar panels on the recreation center."],"cause":["Why would the center still need an electrical connection?","Panels might not provide enough power at all times","Solar panels use no sunlight","Electric wires work only at night","The roof must remain empty","Cloudy conditions and nighttime can limit solar generation."],"infer":["Which question would best support the town’s decision?","How do the costs compare with expected energy savings?","Which color of lunch tray is most popular?","Can panels make sunlight last longer?","How many trees are in another country?","A sound decision needs information about cost and projected benefit."],"vocab":["maintenance","work needed to keep equipment functioning well","a prize given at a school fair","a type of electrical storm","a vegetable grown in a garden"],"concepts":[["solar","panels","sunlight"],["electricity","energy","roof"],["cost","benefits","maintenance"]]},{"level":5,"title":"Who Gets to Tell the Story?","genre":"Historical perspective","paragraphs":["Two short accounts described the opening of a new train station many years ago. A business owner wrote that the station made deliveries faster. A resident living nearby wrote that the trains were loud at night.","Both writers described the same event, but they focused on different effects. The fourth graders compared the accounts and looked for statements each writer could support with observations.","Their teacher explained that historians use several sources because a person’s experience can shape what seems most important in a story about the past. Each perspective offered clues that the other account did not."],"main":"Different sources can describe the same historical event from different viewpoints.","detail":["What benefit did the business owner mention?","Faster deliveries","Quieter trains at night","Cheaper school lunches","More shade in the park","The business owner said the station made deliveries faster."],"cause":["Why did the two accounts emphasize different details?","The writers experienced different effects of the station","One writer had never heard of trains","The station opened on two different days","All historical records must disagree","Personal experiences shaped what each person noticed and valued."],"infer":["How should a student investigate the station fairly?","Compare several accounts and their evidence","Read only the first account","Assume both writers had identical experiences","Ignore the date and context","Multiple accounts offer a fuller understanding of the same event."],"vocab":["perspective","a particular way of seeing or understanding events","the length of a railroad track","a kind of train ticket","a type of historical building"],"concepts":[["station","train","history"],["business","resident","effects"],["sources","viewpoint","compare"]]}],"tests":[{"id":1,"level":1,"articleIds":[2,3,4,8,9]},{"id":2,"level":1,"articleIds":[1,5,9,10,11]},{"id":3,"level":1,"articleIds":[2,5,7,9,11]},{"id":4,"level":1,"articleIds":[0,1,4,8,9]},{"id":5,"level":1,"articleIds":[1,5,7,9,10]},{"id":6,"level":1,"articleIds":[3,6,7,8,9]},{"id":7,"level":1,"articleIds":[1,3,4,10,11]},{"id":8,"level":1,"articleIds":[1 const KEY='evelyn_elpac_grade4_100_v1', MINUTES=20, LIMIT=20;
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function initial(){return {lang:'en',active:null,last:null,history:[]}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}if(!db||typeof db!=='object')db=initial();
db.lang=db.lang==='zh'?'zh':'en';db.history=Array.isArray(db.history)?db.history:[];
const ui={screen:db.active?'quiz':'home',testId:1,questionIndex:db.active?.questionIndex||0,filter:'all',showingLast:true};
const t=k=>DATA.ui[db.lang][k]||k, zh=()=>db.lang==='zh';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Local storage unavailable:',e)}}
function qfmt(n){return String(n).padStart(3,'0')}
function lesson(id){return DATA.tests[id-1]}
function article(i){return DATA.articles[i]}
function iconOf(a){let s=a.title.toLowerCase();if(/bee|bird|swallow|coral|seed|plant|garden|flower|tree|desert|compost/.test(s))return '🌱';if(/water|ocean|rain|stream|weather|puddle/.test(s))return '🌦️';if(/bridge|route|bus|cross|street|station/.test(s))return '🌉';if(/school|book|library|newsletter|letter/.test(s))return '📖';if(/sound|rocket|science|shadow|experiment|sundial/.test(s))return '🔬';if(/painting|art|map|treasure/.test(s))return '🎨';if(/solar|sun/.test(s))return '☀️';return '✨'}
function stats(){let h=db.history;let unique=new Set(h.map(x=>x.testId));let avg=h.length?Math.round(h.reduce((s,x)=>s+x.score,0)/h.length):0;let best=h.length?Math.max(...h.map(x=>x.score)):0;return {h,unique,avg,best}}
function topNav(){let navs=[['home','home'],['curriculum','curriculum'],['progress','progress'],['guide','guide']];return `<header class="top noPrint"><button class="brand" data-action="home"><span class="mark">✦</span><span>${esc(t('brand'))}</span></button><nav class="nav" aria-label="Main navigation">${navs.map(([act,label])=>`<button data-action="${act}" class="${ui.screen===act?'current':''}" aria-current="${ui.screen===act?'page':'false'}">${esc(t(label))}</button>`).join('')}</nav><button class="lang" data-action="lang" aria-label="Switch English and Traditional Chinese">${zh()?'繁中 · EN':'EN · 繁中'}</button></header>`}
function footer(){return `<footer class="footer"><div class="footNote"><span>${esc(t('note'))}</span><span>© 2026 • Evelyn's Study Lab</span></div><p>${esc(t('hideLang'))}</p></footer>`}
function levelName(i){return zh()?DATA.levels[i-1][1]:DATA.levels[i-1][0]}
function levelDesc(i){return zh()?DATA.levels[i-1][3]:DATA.levels[i-1][2]}
function remaining(){return db.active?Math.max(0,db.active.deadline-Date.now()):0}
function timeString(ms){let s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function scoreStatus(score){return score>=80?'pass':score>=60?'marginal':'fail'}
function home(){let s=stats();let next=DATA.tests.find(x=>!s.unique.has(x.id))?.id||1;return `<div class="hero"><div><div class="eyebrow">${esc(t('eyebrow'))} · EVELYN</div><h1>${esc(t('hero'))}</h1><p>${esc(t('sub'))}</p><div class="actions">${db.active?`<button class="bigbtn" data-action="resume">▶ ${esc(t('reopen'))}</button>`:`<button class="bigbtn" data-action="ready" data-id="${next}">▶ ${esc(t('start'))}</button>`}<button class="darkbtn" data-action="curriculum">${esc(t('allLevels'))} →</button></div></div><div class="heroArt" aria-hidden="true"><div class="orb"></div><div class="paper"><div style="font-weight:900;font-size:17px">📖 &nbsp; Reading Mission</div><div class="rule"></div><div class="rule"></div><div class="rule"></div><span class="pill">★ Level Up!</span><div style="font-size:55px;text-align:right;margin-top:-20px">✏️</div></div></div></div>
${db.active?`<div class="notice"><strong>⏱ ${esc(t('activeMessage'))}</strong><span class="grow"></span><button class="primary" data-action="resume">${esc(t('reopen'))} (${timeString(remaining())})</button></div>`:''}
<div class="stats"><div class="stat"><div class="num">${s.unique.size}<span style="font-size:15px">/100</span></div><div class="meta">${esc(t('completed'))}</div></div><div class="stat"><div class="num">${s.avg}%</div><div class="meta">${esc(t('average'))}</div></div><div class="stat"><div class="num">${s.best}%</div><div class="meta">${esc(t('best'))}</div></div><div class="stat"><div class="num">${s.h.length}</div><div class="meta">${esc(t('attempts'))}</div></div></div>
${curriculumContent(true)}${db.last?`<div class="notice"><b>📋 ${esc(t('lastScore'))}: ${db.last.score}%</b><span class="grow"></span><button class="secondary" data-action="last">${esc(t('lastResult'))}</button></div>`:''}`}
function curriculumContent(preview=false){let s=stats();return `<div id="catalog" class="sectionHead"><div><h2>${esc(t('allLevels'))}</h2><p>${esc(t('curriculumText'))}</p></div><div class="micro">60 ORIGINAL PASSAGES · 100 TEST FORMS</div></div><div class="units">${DATA.levels.map((lvl,i)=>{let level=i+1,lessons=DATA.tests.filter(x=>x.level===level),complete=lessons.filter(x=>s.unique.has(x.id)).length;return `<details class="unit" ${level===1?'open':''}><summary><span class="unitIcon">${lvl[4]}</span><span class="unitText"><span class="unitNum">LEVEL ${level} · ${qfmt(level*20-19)}–${qfmt(level*20)}</span><br><b>${esc(levelName(level))}</b><div class="desc">${esc(levelDesc(level))}</div></span><span class="unitCount">${complete}/20 ✓</span></summary><div class="lessonList">${lessons.map(x=>{let done=s.unique.has(x.id),last=[...s.h].reverse().find(h=>h.testId===x.id);return `<div class="lesson ${done?'completed':''}"><div class="lessonTop"><span class="lessonIndex">TEST ${qfmt(x.id)}</span>${done?`<span class="lessonState">✓ ${last.score}%</span>`:''}</div><div class="lessonText">${esc(t('available'))}</div><button class="lessonButton" data-action="ready" data-id="${x.id}">${done?esc(t('tryAgain')):esc(t('practice'))} →</button></div>`}).join('')}</div></details>`}).join('')}</div>`}
function curriculum(){return `<div class="sectionHead"><div><h2>${esc(t('curriculum'))}</h2><p>${esc(t('curriculumText'))}</p></div></div>${curriculumContent()}`}
function ready(){let l=lesson(ui.testId);if(!l)return home();return `<div class="readyCard"><div class="circle">${DATA.levels[l.level-1][4]}</div><div class="overline">LEVEL ${l.level} · TEST ${qfmt(l.id)}</div><h1>${esc(levelName(l.level))}</h1><p>${esc(t('readySub'))}</p><div class="readyPills"><span>⏱ 20 ${esc(t('minutes'))}</span><span>📚 5 ${esc(t('reading'))}</span><span>✍️ 2 ${esc(t('writing'))}</span></div><div class="readyList"><strong>${esc(t('how'))}</strong><ol><li>${esc(t('tip1'))}</li><li>${esc(t('tip2'))}</li><li>${esc(t('tip3'))}</li></ol></div><div class="actions" style="justify-content:center"><button class="secondary" data-action="curriculum">← ${esc(t('back'))}</button><button class="bigbtn" data-action="begin" data-id="${l.id}">▶ ${esc(t('begin'))}</button></div><p class="micro">${esc(t('noFeedback'))}</p></div>`}
function pickOptions(correct,others,kind,reason){let opts=[{text:correct,correct:true,wrong:''}];others.forEach(w=>opts.push({text:w,correct:false,wrong:wrongWhy(kind,w,correct,reason)}));return shuffle(opts)}
function wrongWhy(kind,selected,correct,reason){if(kind==='Main Idea')return `“${selected}” focuses on a different article. The main idea here is: ${correct}`;if(kind==='Vocabulary')return `“${selected}” is not the meaning of this word in context. Here it means “${correct}.”`;if(kind==='Inference')return `“${selected}” is not the conclusion supported by the passage's clues. ${reason}`;if(kind==='Cause & Effect')return `“${selected}” does not explain the cause described by the author. ${reason}`;if(kind==='Visual Reading')return `“${selected}” does not match the diagram or chart. ${reason}`;return `“${selected}” conflicts with or is not supported by the passage. ${reason}`}
function makePool(articleId){let a=article(articleId),q=[],uid=`a${articleId}`;let same=DATA.articles.filter(x=>x.level===a.level&&x.title!==a.title);let alt=shuffle(same).slice(0,3).map(x=>x.main);
q.push({id:uid+'-main',articleId,type:'mc',skill:'Main Idea',stem:'Which sentence best states the MAIN IDEA of the entire passage?',options:pickOptions(a.main,alt,'Main Idea',a.main),correct:a.main,explain:`The main idea connects the important events or ideas: ${a.main} Other details help develop this central message.`});
const map=[['detail','Key Detail'],['cause','Cause & Effect'],['infer','Inference']];for(let [field,skill] of map){let r=a[field];q.push({id:uid+'-'+field,articleId,type:'mc',skill,stem:r[0],correct:r[1],options:pickOptions(r[1],r.slice(2,5),skill,r[5]),explain:r[5]})}
let v=a.vocab;q.push({id:uid+'-vocab',articleId,type:'mc',skill:'Vocabulary',stem:`What does the word “${v[0]}” mean as it is used in the passage?`,correct:v[1],options:pickOptions(v[1],v.slice(2,5),'Vocabulary',`The passage uses “${v[0]}” to mean ${v[1]}.`),explain:`In this context, “${v[0]}” means “${v[1]}.” Read the sentence around the word to check the meaning.`});
if(a.visual){let v=a.visual;q.push({id:uid+'-visual',articleId,type:'mc',skill:'Visual Reading',stem:v.question,correct:v.correct,options:pickOptions(v.correct,v.wrong,'Visual Reading',v.explain),explain:v.explain})}
return q}
function writingQuestion(articleId,mode){let a=article(articleId),uid=`a${articleId}`;if(mode==='summary')return {id:uid+'-write-summary',articleId,type:'write',skill:'Written Summary',stem:`In 2–3 complete English sentences, summarize “${a.title}.” State the main idea and include a specific detail from the passage.`,model:`${a.main} For example, ${a.detail[5]}`,concepts:a.concepts,target:a.main+' '+a.detail[1],explain:`A strong summary states the central idea and supports it with a relevant detail: ${a.main}`};return {id:uid+'-write-reason',articleId,type:'write',skill:'Explain with Evidence',stem:`${a.cause[0]} Write 1–3 complete sentences explaining your answer. Use a detail from the passage as evidence.`,model:`${a.cause[1]}. ${a.cause[5]}`,concepts:a.concepts,target:a.cause[1]+' '+a.cause[5],explain:a.cause[5]}}
function createQuestions(testId){let l=lesson(testId),ids=shuffle(l.articleIds),counts=shuffle([4,4,4,3,3]);let writingIds=shuffle(ids).slice(0,2);let chosen=[];ids.forEach((id,i)=>{let mc=shuffle(makePool(id)).slice(0,counts[i]);if(writingIds.includes(id))mc.push(writingQuestion(id,writingIds.indexOf(id)===0?'summary':'reason'));chosen.push(...shuffle(mc))});if(chosen.length!==20)throw new Error('Question count mismatch');return chosen}
function begin(id){if(db.active){if(!confirm(zh()?'已有測驗進行中，確定放棄舊測驗嗎？':'A timed test is already in progress. Discard it and start another?'))return;}let questions=createQuestions(id);db.active={testId:id,questions,responses:{},flags:{},startedAt:Date.now(),deadline:Date.now()+MINUTES*60*1000,questionIndex:0};db.last=null;persist();ui.questionIndex=0;ui.screen='quiz';render();window.scrollTo(0,0)}
function readText(articleId,compact=false){let a=article(articleId);return `<div class="articleText">${a.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`}
function renderVisual(v){if(!v)return '';if(v.kind==='flow'){return `<div class="visual"><div class="visualTitle">${esc(v.title)}</div><div class="stepFlow">${v.labels.map((label,i)=>`${i?'<span class="flowarrow" aria-hidden="true">➜</span>':''}<span class="step">${esc(label)}</span>`).join('')}</div></div>`}
if(v.kind==='compare'){return `<div class="visual"><div class="visualTitle">${esc(v.title)}</div><div class="compareGrid">${v.labels.map((label,i)=>`<div class="compareBox"><b>${esc(label)}</b><p>${esc(v.values[i])}</p></div>`).join('')}</div></div>`}
if(v.kind==='bars'){let max=Math.ceil(Math.max(...v.values)/5)*5,positions=v.values.map((n,i)=>{let x=66+i*(448/v.values.length),w=Math.min(68,350/v.values.length),h=n/max*155;return `<rect x="${x}" y="${194-h}" width="${w}" height="${h}" rx="5" fill="${i%2?'#329d98':'#145d75'}"/><text x="${x+w/2}" y="${187-h}" text-anchor="middle" font-size="14" font-weight="700" fill="#164456">${n}</text><text x="${x+w/2}" y="217" text-anchor="middle" font-size="${v.labels.length>3?11:13}" fill="#325869">${esc(v.labels[i])}</text>`}).join('');return `<div class="visual"><div class="visualTitle">${esc(v.title)}</div><svg role="img" aria-label="${esc(v.title+' '+v.labels.map((l,i)=>l+': '+v.values[i]).join(', '))}" viewBox="0 0 540 240"><line x1="51" y1="194" x2="525" y2="194" stroke="#779b9b" stroke-width="1.5"/>${[0,1,2,3,4].map(i=>{let val=Math.round(i*max/4),y=194-i*155/4;return `<line x1="51" y1="${y}" x2="525" y2="${y}" stroke="#dae8e5"/><text x="38" y="${y+4}" text-anchor="end" font-size="11" fill="#607e85">${val}</text>`}).join('')}${positions}</svg></div>`}return ''}

const STOP=new Set('a an the and or but by of for to in on at is are was were be being been do does did it its that this there with as from which who what when where why how who can could should would will have has had he she they their his her a few one all some many most you we them into about more less than after before not only too very an if so near under over between while because'.split(' '));
const norm=x=>String(x||'').toLowerCase().normalize('NFKD').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
const words=x=>norm(x).split(' ').filter(Boolean);
function matches(tok,answer){let plain=norm(answer);if(!plain)return false;let w=norm(tok);if(!w)return false;if(w.includes(' ')&&plain.includes(w))return true;let es=words(plain);return es.some(a=>a===w || (w.length>=5 && (a===w+'s'||a===w+'ed'||a===w+'ing'||a===w.slice(0,-1)||a===w+'es'||w===a+'s'||w===a+'ed'||w===a+'ing')))}
function judgeWriting(q,input){let raw=String(input||'').trim(), ws=words(raw);if(!raw)return {score:0,reason:'No response entered.',hits:0,groups:0,wordCount:0};let groups=q.concepts||[],hit=groups.map(arr=>arr.some(x=>matches(x,raw))).filter(Boolean).length;let targets=words(q.target||'').filter(x=>x.length>3&&!STOP.has(x));let matched=targets.filter(x=>matches(x,raw)).length;let overlap=targets.length?matched/targets.length:0;let sentences=(raw.match(/[.!?](?=\s|$)/g)||[]).length;let complete=sentences>=1||ws.length>=10;let fromPrompt=norm(raw)===norm(q.stem);let score=0;
if(ws.length>=10&&complete&&!fromPrompt&&((ws.length>=12&&hit>=2&&overlap>=0.18)||(ws.length>=12&&overlap>=0.55&&hit>=1)||overlap>=0.72))score=1;
else if(ws.length>=7&&(hit>=1||overlap>=0.20)&&!fromPrompt)score=.5;
return {score,hits:matched,groups:hit,wordCount:ws.length,reason:`Estimated concept match: ${hit}/${groups.length} topic groups; ${matched}/${targets.length} reference keywords; ${ws.length} words. ${score===1?'The response includes several relevant ideas.':score===.5?'Partly relevant; add a clear detail and explanation.':'The response needs more relevant information or fuller sentences.'}`}}
function computeResult(r){let pts=0,answered=0,correctCount=0;for(let i=0;i<r.questions.length;i++){let q=r.questions[i],resp=String(r.responses[q.id]??'').trim();if(resp)answered++;let e=r.scores[i];if(q.type==='mc'){e.score=resp===q.correct?1:0;e.estimated=false;}else{let j=judgeWriting(q,resp);e.info=j;e.estimated=true;e.score=e.override!=null?e.override:j.score}pts+=e.score;if(e.score===1)correctCount++}r.answered=answered;r.pts=pts;r.score=Math.round(pts/20*100);r.correctCount=correctCount;return r}

function teacherExplain(q){

  return (hints[q.skill]||'仔細閱讀原文，找出可以支持答案的證據。')+' '+q.explain;
}

est supported by the full passage?","answer":"Students worked together to make their reading shelf more useful.","wrong":"One student liked mystery books.","why":"The text explains: Soon the shelf included many genres, and more classmates visited it. Students helped shape a collection everyone could enjoy. This supports the answer and connects the important evidence.","whyNot":"That answer either contradicts the passage or focuses on an unsupported or incomplete detail.","takeaway":"Find the common message across both paragraphs. Main idea = what the entire text is mostly about.","image":"","keys":["Students","worked","together","make","their"]},{"title":"The Lantern Parade","paras":["A neighborhood planned an evening parade, but strong winds made candles unsafe. The organizers did not want to cancel the celebration. Children decorated battery-powered lanterns with colorful paper. Parents checked the lights before the parade began.","The parade glowed brightly without open flames. The organizers found a safer way to keep the tradition."],"prompt":"Which statement is best supported by the full passage?","answer":"A community adapted its parade to stay safe.","wrong":"Paper comes in several colors.","why":"The text explains: The parade glowed brightly without open flames. The organizers found a safer way to keep the tradition. This supports the answer and connects the important evidence.","whyNot":"That answer either contradicts the passage or focuses on an unsupported or incomplete detail.","takeaway":"Find the common message across both paragraphs. Main idea = what the entire text is mostly about.","image":"","keys":["community","adapted","parade","stay","safe"]},{"title":"Sharing the Court","paras":["Two groups arrived at the playground basketball court. One wanted to practice shooting; the other planned a short game. Instead of arguing, the groups agreed to divide the time equally. They used a timer so everyone knew when to switch.","Both groups played, and severa s gathered around a pond. Small bats swooped over the water to catch them. Researchers placed low lights near a viewing platform so visitors could see the bats without shining flashlights at them.","The gentler lighting helped people observe while disturbing the animals less."],"prompt":"Which statement is best supported by the full passage?","answer":"Low lights reduced disturbance during observations.","wrong":"Bats were attracted by loud music.","why":"The text explains: The gentler lighting helped people observe while disturbing the animals less. This supports the answer and connects the important evidence.","whyNot":"That answer either contradicts the passage or focuses on an unsupported or incomplete detail.","takeaway":"Look for because, since, so, and therefore. A cause explains WHY; an effect tells WHAT happened.","image":"","keys":["lights","reduced","disturbance","during","observations"]},{"title":"A Flooded Sidewalk","paras":["After a long storm, leaves blocked a sidewalk drain. Water spread across the walkway. City workers removed the wet leaves and checked the pipe. The water began to flow away.","Pedestrians could cross the sidewalk without walking through a deep puddle."],"prompt":"Which statement is best supported by the full passage?","answer":"Removing the leaves allowed water to drain.","wrong":"The puddle disappeared because the sidewalk got wider.","why":"The text explains: Pedestrians could cross the sidewalk without walking through a deep puddle. This supports the answer and connects the important evidence.","whyNot":"That answer either contradicts the passage or focuses on an unsupported or incomplete detail.","takeaway":"Look for because, since, so, and therefore. A cause explains WHY; an effect tells WHAT happened.","image":"","keys":["Removing","leaves","allowed","water","drain"]},{"title":"The Pollinator Patch","paras":["The community garden had many flowers but few bees in early spring. Volunteers planted native flowers that bloom at di ic evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"Sharing the Tablet","script":"'Only one tablet is available,' Mr. Singh said. 'The research group needs it to read articles, and the art group needs it to draw.' Maya proposed using a schedule with twenty-minute turns. Both groups agreed.","prompt":"What resolved the disagreement?","answer":"Making a schedule to share the tablet.","wrong":"Giving the tablet to the art group for the entire day.","why":"The students agree to take turns using the tablet.","whyNot":"One group using it all day would not follow the agreed schedule.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"The Art Fair Vote","script":"The class discussed art-fair booths. Leo favored clay sculptures because visitors could see shapes from all sides. Olivia favored posters because they could share more written facts. The class decided to include both displays.","prompt":"What was the class's final decision?","answer":"Include sculptures and information posters.","wrong":"Display only sculptures to save space.","why":"The final sentence combines both students' ideas.","whyNot":"Saving space was not stated as a reason to reject posters.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"The Garden Debate","script":"'Tomatoes grow well here,' said Rosa. 'But our garden has little shade,' said Drew. Their teacher suggested planting leafy greens near the fence and trying tomatoes in the sunniest beds.","prompt":"How did the plan account for different plant needs?","answer":"By choosing different garden locations for different plants.","wrong":"By watering every plant at the same time.","why":"The plan uses sunny beds and shaded fence areas for different plants.","whyNot":"Watering schedules are not the focus of this discussion.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"The Book Club Plan","script":"'We could all read the same mystery,' said Noah. 'Some of us enjoy nonfiction more,' said Priya. They agreed to choose from three books and meet later to share a favorite detail from each.","prompt":"How did the book club include different interests?","answer":"By offering a choice of three books.","wrong":"By assigning each member a chapter of one mystery.","why":"The compromise provides choices and a shared discussion task.","whyNot":"Assigning chapters of one mystery would not address the interest in nonfiction.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""}]},{"id":"L05","domain":"listening","title":"Academic Mini-Lectures","goal":"Identify the subject, main point, and examples.","steps":["Listen once without reading.","Replay once and identify the main idea.","Answer the listening check.","Read the transcript AFTER listening and locate the clue.","Explain why the alternative does not match."],"what":"Listening uses meaning, tone, and key details.","why":"Distractors often change the time, action, or speaker’s purpose.","items":[{"title":"How Rocks Change","script":"Rocks can change without melting. Water slips into cracks, freezes, and expands. Over many winters, the expanding ice may split a large rock into smaller pieces. Scientists call this weathering.","prompt":"What causes the rock to split in this example?","answer":"Water freezing and expanding in cracks.","wrong":"Sunlight changing the rock into sand immediately.","why":"Expanding ice pushes on the sides of cracks.","whyNot":"Sunlight is not the process described; the change also occurs over many winters.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"Where Clouds Form","script":"Warm air can hold water vapor. When moist air rises and cools, some vapor forms tiny water droplets or ice crystals. A large collection of those droplets and crystals is a cloud.","prompt":"How do clouds form according to the explanation?","answer":"Moist air cools and water gathers in tiny droplets or crystals.","wrong":"Wind blows ocean waves upward into the sky.","why":"Cooling leads vapor to condense into droplets or crystals.","whyNot":"Ocean spray may exist near waves, but it is not the cloud-forming process given.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"Why Shadows Move","script":"A shadow forms when an object blocks light. In the morning, sunlight arrives from low in the sky and shadows stretch far. Near noon, the sun is higher, so the same object's shadow often becomes shorter.","prompt":"Why may a tree's shadow be shorter near noon?","answer":"The sunlight comes from a higher angle.","wrong":"The tree's branches become smaller at noon.","why":"The apparent position of the sun changes the direction and length of shadows.","whyNot":"The tree itself does not need to shrink for its shadow to change.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"How Ants Communicate","script":"Some ants leave chemical trails when they find food. Other ants follow the trail toward the food source. As more ants travel the route, they may reinforce the trail with additional chemicals.","prompt":"How do the ants help one another find food?","answer":"By following chemical trails.","wrong":"By listening for bird calls above the food.","why":"The presentation explains chemical trails that other ants follow.","whyNot":"Bird calls are not offered as a communication method in this explanation.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"What Makes Echoes","script":"An echo happens when a sound wave bounces off a surface and travels back to the listener. A distant rock wall may reflect a shout. Soft curtains usually absorb more sound than a bare wall.","prompt":"Why might a shout echo near a rock wall?","answer":"The hard wall reflects sound back.","wrong":"The wall creates a second person who is shouting.","why":"The returning sound is a reflection of the original shout.","whyNot":"An echo is not a new shout made by another person.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"Why Leaves Change","script":"In autumn, some trees stop making as much green chlorophyll as daylight hours shorten. Yellow and orange pigments that were already in the leaf become easier to see. Some leaves also develop red pigments.","prompt":"Why do yellow and orange leaf colors become easier to see?","answer":"Green chlorophyll decreases.","wrong":"The leaves are painted by autumn rain.","why":"The explanation says reduced chlorophyll reveals other pigments.","whyNot":"Rain is not described as adding paint or changing the pigments directly.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""}]},{"id":"L06","domain":"listening","title":"Cause, Effect & Predictions","goal":"Listen for reasons and likely outcomes.","steps":["Listen once without reading.","Replay once and identify the main idea.","Answer the listening check.","Read the transcript AFTER listening and locate the clue.","Explain why the alternative does not match."],"what":"Listening uses meaning, tone, and key details.","why":"Distractors often change the time, action, or speaker’s purpose.","items":[{"title":"The Leaking Faucet","script":"A faucet in the schoolyard dripped le.","prompt":"What will likely change after the curtains are opened?","answer":"The seedlings will receive light across more of the table.","wrong":"The seedlings will no longer need water at all.","why":"Opening curtains increases light over the table.","whyNot":"Water needs are separate from whether the plants receive light.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"The Early Train","script":"The early train left at seven ten instead of seven thirty because workers needed the tracks clear later that morning. A notice asked travelers to arrive by seven o'clock.","prompt":"Why was the train schedule changed?","answer":"Track work was planned for later that morning.","wrong":"A holiday parade required extra passengers.","why":"Track maintenance is the explicit reason for the early departure.","whyNot":"The script does not mention a parade or passenger demand.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Cloudy Telescope Night","script":"A thick layer of clouds covered the sky before the astronomy club met. Instead of viewing the stars through the telescope, the instructor showed the group a digital map of constellations.","prompt":"Why did the group use a digital star map?","answer":"Clouds blocked the view through the telescope.","wrong":"The telescope was being borrowed by another school.","why":"Cloud cover prevented the planned sky viewing.","whyNot":"Nothing in the presentation suggests the telescope was unavailable because of another school.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""}]},{"id":"L07","domain":"listening","title":"Compare Two Ideas","goal":"Catch similarities and differences in oral language.","steps":["Listen once without reading.","Replay once and identify the main idea.","Answer the listening check.","Read the transcript AFTER listening and locate the clue.","Explain why the alternative does not match."],"what":"Listening uses meaning, tone, and key details.","why":"Distractors often change the time, action, or speaker’s purpose.","items":[{"title":"Raincoat or Umbrella","script":"An umbrella is easy to fold into a backpack, but it leaves a person's legs exposed. A raincoat covers more of the body and keeps both hands free. Either can help during a rain shower.","prompt":"What advantage of a raincoat is described?","answer":"It keeps both hands free.","wrong":"It can always fit inside a pencil case.","why":"The speaker explicitly says a raincoat leaves both hands free.","whyNot":"The small storage advantage is associated with a foldable umbrella, not a pencil case.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"Painting or Sculpture","script":"A painting usually shows colors and shapes on a flat surface. A sculpture is three-dimensional, so viewers can walk around it and examine different sides. Both forms allow artists to express ideas.","prompt":"How is sculpture different from painting in this explanation?","answer":"A sculpture can be viewed from different sides in three dimensions.","wrong":"A sculpture always uses only one color.","why":"The defining comparison is three-dimensional form.","whyNot":"No rule limiting a sculpture to one color is stated.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"Bus or Bike","script":"Riding a bike produces little direct air pollution and allows flexible stops, but a bus carries many passengers at once. On a rainy day, a covered bus ride may be more comfortable. Both can reduce the number of individual car trips.","prompt":"Which benefit is specific to a bus in this talk?","an  for model bridges.","why":"Her excited words and invitation show enthusiasm and a desire for visitors.","whyNot":"Ava mentions a model bridge but does not give rules about building one.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Careful Warning","script":"'Please stay behind the yellow line,' the guide said firmly. 'The glass is fragile, and the workers need room to move the display safely.'","prompt":"Why does the guide speak firmly?","answer":"To prevent an accident near the display.","wrong":"To ask visitors to choose the next exhibit.","why":"The guide gives a safety instruction and explains the danger.","whyNot":"Choosing an exhibit is unrelated to staying behind the line.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Grateful Message","script":"'Thank you for helping me carry the books,' Ms. Wu said warmly. 'I could not have moved the whole stack by myself, and now our reading corner is ready.'","prompt":"What feeling does Ms. Wu express?","answer":"Gratitude for someone's help.","wrong":"Disappointment that the reading corner is too small.","why":"She directly thanks the helper and names the benefit.","whyNot":"She does not criticize the reading corner or express disappointment.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Polite Disagreement","script":"'I see why you want a longer recess,' said Luis, 'but I wonder whether we could keep the same recess and add a five-minute movement break before math.'","prompt":"What is Luis doing?","answer":"Respectfully offering a different idea.","wrong":"Announcing a final rule made by the principal.","why":"He acknowledges another view and suggests an alternative.","whyNot":"His suggestion is not described as a rule or decision by the principal.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Concerned Reminder","script":"'Remember to pack your permission slip tonight,' Dad said. 'The museum trip is Thursday, and your teacher needs the forms tomorrow morning.'","prompt":"What is Dad's main purpose?","answer":"Remind the child to bring a required form.","wrong":"Describe the museum's most famous exhibits.","why":"The focus is the deadline for a permission slip.","whyNot":"The museum is mentioned as context; no exhibits are described.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Friendly Suggestion","script":"'If you are having trouble with that paragraph,' Zoey said kindly, 'try circling the topic sentence before you reread it. That helps me find the main idea.'","prompt":"Why does Zoey make the suggestion?","answer":"To offer a helpful reading strategy.","wrong":"To assign an extra reading test.","why":"Zoey gives a practical strategy based on her experience.","whyNot":"She does not assign a test or give instructions as a teacher.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""}]},{"id":"L10","domain":"listening","title":"Longer Oral Presentations","goal":"Connect opening, supporting details, and conclusion.","steps":["Listen once without reading.","Replay once and identify the main idea.","Answer the listening check.","Read the transcript AFTER listening and locate the clue.","Explain why the alternative does not match."],"what":"Listening uses meaning, tone, and key details.","why":"Distractors often change the time, action, or speaker’s purpose.","items":[{"title":"Tour of a Planetarium","script":"Welcome to the planetarium. In the center of the room, a machine projects stars onto the dome. The patterns show how the sky appears from different places on Earth. Later, we will dim the room and watch a short model of the moon's movement. Remember that the dome is a model, not the real night sky.","prompt":"What is the main purpose of the presentation?","answer":"Introduce how the planetarium models the sky.","wrong":"Explain how to build a telescope at home.","why":"The machine, dome, and moon demonstration all describe a sky model.","whyNot":"No telescope-building procedure appears in the introduction.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":"earth"},{"title":"Protecting Sea Grass","script":"Seagrass grows in shallow coastal water. Its leaves provide shelter for young fish, and its roots help hold sediment in place. Boats with dragging anchors can damage these underwater meadows. People can protect seagrass by using marked mooring areas and avoiding sensitive habitats. A healthy meadow supports many kinds of marine life.","prompt":"Why is protecting seagrass important?","answer":"It provides habitat and helps stabilize the seabed.","wrong":"It makes every beach safe for swimming.","why":"Shelter and sediment stability are the two benefits described.","whyNot":"Swimming conditions are not discussed and cannot be concluded from seagrass alone.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Bird Migration Talk","script":"Many birds travel long distances when the seasons change. Some search for food that becomes scarce in winter, while others move toward places where they can nest. Scientists track migration using lightweight bands and observations. Maps of the routes help people learn which stopover habitats migrating birds need.","prompt":"What do migration maps help scientists understand?","answer":"Where traveling birds need places to rest and feed.","wrong":"Which birds sing the loudest near schools.","why":"The presentation connects mapped routes to important stopover habitats.","whyNot":"Birdsong loudness is unrelated to the purpose of tracking migration.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":"butterfly"},{"title":"How Bridges Work","script":"A bridge must carry weight safely across a gap. Engineers choose supports based on the width of the gap, the materials available, and how the bridge will be used. An arch sends forces into the supports at its ends. A beam spreads weight along its length. Different designs solve different problems, so engineers test their plans before construction.","prompt":"What is the presentation's central message?","answer":"Bridge designs and supports depend on engineering needs.","wrong":"Every bridge should use an arch regardless of location.","why":"The speaker compares types of support and explains design tradeoffs.","whyNot":"The speaker presents multiple designs rather than insisting that arches always work best.","takeaway":"Listen for the specific evidence that answers the question. A realistic alternative can still be unsupported.","image":""},{"title":"A Museum of Inventions","script":"In this museum of inventions, the first room shows early ways people measured time. The next room contains tools that made farming easier. At the final display, visitors can compare an old camera with a modern one. The goal is to notice how people create new tools to solve familiar problems. Please leave the displays in place for the next group.","prompt":"What common idea connects the museum rooms?","answer":"Inventions are created to solve different problems.","wrong":"All inventions were first made for taking pictures.","why":"Timekeeping, farming, and photography all illustrate tools meeting needs.","whyNot":"Only the final display concerns cameras, not every invention.","takeaway":"Listen for the specific // Retain punctuation with its sentence. Explicitly handle closing quotation marks after questions.
// Abbreviations (Ms., Dr., etc.) and numeric decimals must not create spurious sentence stops.
function spokenSentences(text){
 let source=String(text||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').trim();
 if(!source)return [];
 let chunks=[],start=0;
 for(let i=0;i<source.length;i++){
  let ch=source[i];if(ch!=='.'&&ch!=='!'&&ch!=='?')continue;
  if(ch==='.'&&/\d/.test(source[i-1]||'')&&/\d/.test(source[i+1]||''))continue;
  let before=source.slice(Math.max(start,i-15),i);
  if(ch==='.'&&/(?:\bMr|\bMrs|\bMs|\bDr|\bProf|\bSt|\bJr|\bSr|\bvs|\betc)$/i.test(before))continue;
  let end=i+1;while(end<source.length&&/[!?]/.test(source[end]))end++;
  while(end<source.length&&/[\"'”’)]/.test(source[end]))end++;
  if(end<source.length&&!/\s/.test(source[end]))continue;
  let phrase=source.slice(start,end).trim();
  if(phrase)chunks.push({text:phrase,kind:ch==='?'?'question':ch==='!'?'emphasis':'sentence',para:/\n\s*\n/.test(source.slice(end,end+6))});
  while(end<source.length&&/\s/.test(source[end]))end++;
  start=end;i=end-1;
 }
 let rest=source.slice(start).trim();if(rest)chunks.push({text:rest,kind:'sentence'});
 return chunks;
}
function speakText(text,slow=false){
 if(!isVoiceAvailable()){alert(tx('audioUnavailable'));return false}
 const chunks=spokenSentences(text);
 if(!chunks.length)return false;

 const rate=slow?Math.min(0.9,Number(audioPref('rate'))):Number(audioPref('rate'))||0.96;
 let index=0;
 function next(){
  if(mySeq!==playbackSequence)return;
  if(index>=chunks.length){audioStarted=false;playbackTimer=null;audioStatus(tx('audioDone'));return}
  const c=chunks[index++];let u=new SpeechSynthesisUtterance(c.text);
  u.lang='en-US';if(voice)u.voice=voice;
  u.rate=rate;u.pitch=1.02;u.volume=1;
  u.onstart=()=>{if(mySeq===playbackSequence){audioStarted=true;audioStatus(tx('audioPlaying'))}};
  u.onend=()=>{
   if(mySeq!==playbackSequence)return;
   const gap=c.kind==='question'?610:c.kind==='emphasis'?370:255;
   const factor=audioPref('pause')==='clear'?1.5:1;
   playbackTimer=setTimeout(next,Math.round((c.para?Math.max(gap,580):gap)*factor));
  };
  u.onerror=e=>{if(mySeq!==playbackSequence)return;if(e.error==='interrupted'||e.error==='canceled'){return}playbackTimer=setTimeout(next,280)};
  try{speechSynthesis.speak(u)}catch(e){stopAudio();audioStatus(tx('audioUnavailable'))}
 }
 next();return true;
}
