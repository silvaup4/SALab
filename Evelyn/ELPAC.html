<body><div class="app" id="app"><p>Opening Evelyn’s ELPAC Study Lab…</p></div>
<script>
'use strict';
const DATA={"articles":[{"level":1,"title":"The Missing Library Book","genre":"Story","paragraphs":["Maya had borrowed a book about sea turtles from the school library. On Monday, she opened her backpack to return it, but the book was missing. She checked her desk twice and felt a knot form in her stomach.","At recess, Maya remembered showing the book to her younger brother at the kitchen table. She asked her father to look there. He found it beneath a colorful placemat and brought it to school after lunch.","Maya thanked her father and returned the book. That evening, she made a special pocket in her backpack for library books so she could keep track of them."],"main":"Maya solves a lost-book problem and learns to stay organized.","detail":["Where was the book found?","Under a placemat on the kitchen table","Inside Maya’s desk","On the playground","Behind a bookshelf","Maya remembered reading at the kitchen table, where her father found it."],"cause":["Why did Maya ask her father to check the kitchen?","She remembered showing the book to her brother there","Her teacher told her to search the kitchen","The librarian had called her father","She wanted a new book","Remembering where she last used the book helped Maya choose where to look."],"infer":["What will Maya probably do the next time she borrows a book?","Keep it in the special backpack pocket","Leave it in the playground","Stop borrowing books forever","Ask her brother to hide it","Making the pocket suggests Maya plans to keep library books in one safe place."],"vocab":["borrowed","used something that must be returned","bought something forever","threw something away","wrapped something as a gift"],"concepts":[["book","library"],["found","kitchen","table"],["pocket","organized","safe"]]},{"level":1,"title":"Seeds in Two Windows","genre":"Informational story","paragraphs":["In science class, Owen and Priya placed bean seeds in two identical cups. Each cup had the same soil and water. They put one cup beside a bright window and the other inside a dark cabinet.","After one week, the seed near the window had sturdy green leaves. The seed in the cabinet had a pale, thin stem. Priya carefully measured both plants and recorded her observations in a chart.","The students concluded that light helped the plant grow green and strong. They decided to move the pale plant to the window and observe what happened next."],"main":"An experiment shows how light affects growing bean plants.","detail":["Which plant had sturdy green leaves?","The plant by the bright window","The plant in the dark cabinet","Both plants without any difference","A plant outside the classroom","The cup near the window had sturdy green leaves after one week."],"cause":["Why did the students give both cups the same soil and water?","To test light without changing other conditions","To make one seed grow faster by magic","To prevent either seed from sprouting","To avoid measuring the plants","Keeping soil and water equal helps isolate the effect of light."],"infer":["What is a reasonable prediction for the pale plant after it moves to the window?","New growth may become greener","Its leaves will turn into flowers overnight","It will no longer need water","The soil will turn into sand","The window plant was green; more light may help the pale plant produce green growth."],"vocab":["observations","things noticed and recorded","things purchased at a store","rules for a game","pictures from a story"],"concepts":[["light","window","sun"],["plant","green","leaves"],["experiment","soil","water"]],"visual":{"kind":"compare","title":"The Bean Seed Experiment","labels":["Bright window","Dark cabinet"],"values":["Green, sturdy leaves","Pale, thin stem"],"question":"Which observation belongs to the cup in the dark cabinet?","correct":"A pale, thin stem","wrong":["Strong green leaves","A tall flowering tree","No seed was planted"],"explain":"The dark-cabinet plant grew a pale, thin stem, unlike the window plant."}},{"level":1,"title":"The Rainy-Day Plan","genre":"Story","paragraphs":["The fourth graders planned to play kickball at their class celebration. But heavy rain covered the playground with puddles. Several students stared sadly through the classroom window.","Ms. Chen invited the class to suggest indoor activities. Mateo proposed a board-game tournament, while Aisha suggested making paper airplanes. The class voted and chose both ideas.","By the end of the afternoon, everyone had tried a new game and tested an airplane. The rain never stopped, but the students agreed that the celebration had been fun anyway."],"main":"The class adapts its celebration when rain changes its plans.","detail":["What two activities did the class choose?","Board games and paper airplanes","Kickball and swimming","Painting walls and gardening","A movie and a field trip","The students voted for Mateo’s and Aisha’s suggestions."],"cause":["Why did the class stay indoors?","Rain made the playground wet","The principal canceled all celebrations","No one wanted to play games","The playground was being painted","Heavy rain left puddles where kickball would have been played."],"infer":["Which quality did the students show?","Flexibility when their first plan failed","Anger toward anyone who liked kickball","A refusal to try anything different","Fear of working with classmates","The class considered new choices and still enjoyed the celebration."],"vocab":["proposed","suggested an idea","forgot a rule","finished a race","painted a picture"],"concepts":[["rain","wet","puddles"],["indoors","classroom"],["games","airplanes","activities"]]},{"level":1,"title":"A New Student at Lunch","genre":"Story","paragraphs":["Nico started at a new school on Tuesday. In the cafeteria, he carried his lunch tray slowly because he did not know where to sit. Most tables were already full of students talking together.","Zoe noticed Nico standing near the door. She moved her backpack off an empty chair and invited him to join her friends. She introduced everyone and asked what games he liked.","By Friday, Nico had learned several names and joined a group at recess. He remembered how much one friendly invitation had helped him on his first day."],"main":"A small act of kindness helps a new student feel welcome.","detail":["What did Zoe move to make room for Nico?","Her backpack","A stack of library books","A lunch cart","A classroom desk","Zoe cleared an empty chair by moving her backpack."],"cause":["Why was Nico moving slowly in the cafeteria?","He was unsure where to sit","He had spilled his lunch","He was waiting for a teacher’s test","He had forgotten his shoes","Nico did not know anyone or where to sit in his new school."],"infer":["How did Nico probably feel after Zoe invited him?","Relieved and more included","Upset that he had new friends","Disappointed that a chair was empty","Angry about the lunch menu","The invitation solved his immediate problem and led to new friendships."],"vocab":["invited","asked someone to join","ordered someone to leave","ignored someone on purpose","warned someone about rain"],"concepts":[["Zoe","friend","invited"],["Nico","new","student"],["welcome","kind","included"]]},{"level":1,"title":"The Garden Sign","genre":"Story","paragraphs":["The school garden grew tomatoes, beans, and sunflowers. One morning, Mrs. Patel found broken stems near the path. Students had been stepping into the beds to look at the tallest plants.","Sofia and her group made bright signs that said, “Please stay on the path.” They also placed smooth stones along the edge of each garden bed so visitors could see where to walk.","Two weeks later, the plants beside the path were growing well. The class realized that a clear sign and a simple boundary could protect something everyone enjoyed."],"main":"Students protect their garden by guiding visitors to stay on paths.","detail":["What did students place along the garden beds?","Smooth stones","Plastic cups of paint","Wooden chairs","Soccer balls","Stones made the border between the path and plants easier to see."],"cause":["Why were stems breaking?","Visitors stepped into the planted beds","Insects ate the school signs","The sunflowers grew too slowly","Students never watered the plants","People entered the beds while looking at the plants."],"infer":["Which idea does the story support?","Clear directions can prevent accidental damage","The tallest plants always need the least care","Gardens should never have visitors","Only teachers can protect plants","The signs and stones reduced damage by showing where visitors should walk."],"vocab":["boundary","a line or edge that marks a limit","a kind of tomato seed","a place where books are sold","a tool for measuring rainfall"],"concepts":[["garden","plants","stems"],["sign","stones","path"],["protect","damage","boundary"]]},{"level":1,"title":"The Little Bridge","genre":"Story","paragraphs":["At a nature center, volunteers built a short wooden bridge over a muddy trail. Before the bridge existed, walkers often stepped around the puddle and crushed small flowers growing nearby.","The new bridge was narrow but strong. A ranger placed a sign at each end reminding visitors to walk across instead of around it. During the next rainy week, more people used the trail without leaving footprints among the flowers.","The ranger explained that even a small structure can solve more than one problem: it can keep shoes dry and protect living things."],"main":"A small bridge protects both trail walkers and nearby flowers.","detail":["What did walkers crush before the bridge was built?","Small flowers beside the trail","Wooden benches","Bird nests in trees","Rocks in a creek","Walking around the puddle damaged flowers growing near the trail."],"cause":["Why did the volunteers build the bridge?","To let people cross mud without stepping on plants","To make the trail longer for races","To cover the flowers from sunlight","To block every visitor from the center","The bridge provided a safe route over the muddy area."],"infer":["What can be inferred about the ranger’s sign?","It encouraged visitors to use the bridge","It warned that the bridge was broken","It asked visitors to pick flowers","It explained how to plant new trees","Signs at both ends reminded walkers to cross on the bridge."],"vocab":["structure","something built for a purpose","a wild animal’s footprint","a rule about spelling","a type of flower"],"concepts":[["bridge","trail","mud"],["flowers","plants","protect"],["walkers","visitors","cross"]]},{"level":1,"title":"When the Power Went Out","genre":"Story","paragraphs":["During a summer evening, a storm caused the lights in Harper’s house to go out. Her family found flashlights and sat together at the kitchen table. Without the television, the rooms seemed unusually quiet.","Harper’s grandfather suggested telling stories. He described riding his bicycle to school when he was young. Harper listened carefully and asked questions about the town in those days.","When electricity returned, Harper wrote down her grandfather’s favorite story. She decided that the evening had been memorable even though the family’s original plans had changed."],"main":"A power outage becomes an opportunity for family storytelling.","detail":["What did Harper write down afterward?","Her grandfather’s favorite story","The television schedule","A list of new batteries","Directions to the grocery store","Harper recorded the story after the electricity returned."],"cause":["Why did the family sit with flashlights?","A storm had caused a power outage","They were camping in the woods","Their table lamp needed dusting","They were preparing a surprise party","With no electric lights, the family used flashlights."],"infer":["What did Harper most likely learn about her grandfather?","He had experiences different from hers","He disliked every kind of story","He had never ridden a bicycle","He preferred watching television all night","His description of school trips showed her what his childhood was like."],"vocab":["memorable","worth remembering","hard to understand","easy to carry","no longer useful"],"concepts":[["storm","power","outage"],["grandfather","story","past"],["family","together","remember"]]},{"level":1,"title":"The Recycled Robot","genre":"Story","paragraphs":["The class was challenged to build a model using only reused materials. Luis brought a cereal box, bottle caps, and empty paper tubes. He wanted to create a robot with moving arms.","His first design fell over because the paper-tube legs were too narrow. Luis studied the model and attached two wider cardboard feet. On the next try, the robot stood straight.","At the class display, Luis explained both versions of his robot. He said the mistake had helped him see what needed to change."],"main":"Luis improves a recycled robot by learning from an unsuccessful design.","detail":["What change helped the robot stand?","Adding wider cardboard feet","Removing its cardboard body","Covering it in wet paint","Making the arms much heavier","Wider feet supported the robot after the narrow legs failed."],"cause":["Why did the first robot fall over?","Its legs were too narrow for balance","Its bottle caps were colorful","The cereal box was empty","The classroom had no tables","The passage states that the narrow legs could not keep the robot upright."],"infer":["What kind of thinker is Luis?","Someone who uses mistakes to improve a design","Someone who stops when a first try fails","Someone who refuses to share ideas","Someone who never checks a model","Luis observed a problem, changed his design, and explained what he learned."],"vocab":["challenged","given a difficult task to try","told to stop learning","invited to eat lunch","asked to borrow a pencil"],"concepts":[["robot","model","design"],["feet","balance","stand"],["mistake","improve","change"]]},{"level":1,"title":"The Bus Stop Map","genre":"Story","paragraphs":["After moving to a new neighborhood, Lila needed to learn which bus took her to the community pool. The bus stop had a colorful route map with numbers and arrows.","Lila followed the blue route with her finger and saw that it passed the library before reaching the pool. Her mother checked the printed schedule. Together, they learned that the bus arrived every twenty minutes on Saturdays.","On their first trip, Lila recognized the library stop and knew that the pool would be next. The map gave her confidence about traveling in an unfamiliar place."],"main":"Lila learns to use a route map and schedule to travel confidently.","detail":["Which stop came before the pool?","The library","The airport","The fire station","The museum","The blue route passed the library just before the pool."],"cause":["Why did Lila’s mother check the schedule?","To learn when the bus would arrive","To find the price of swimming lessons","To see the library’s book list","To locate the nearest park","A schedule provides arrival times, while the route map shows destinations."],"infer":["What probably made Lila more confident on the bus?","Recognizing a landmark shown on the map","Forgetting the route number","Taking a bus without checking stops","Closing her eyes near the pool","Seeing the library told Lila her destination was approaching."],"vocab":["unfamiliar","not known yet","very expensive","easy to wash","already broken"],"concepts":[["map","route","schedule"],["library","pool","stop"],["confident","learn","travel"]]},{"level":1,"title":"Sharing the Art Supplies","genre":"Story","paragraphs":["The art club had twelve paintbrushes, but eighteen children came to make posters. At first, several students rushed to grab the largest brushes. Others waited with empty cups of paint.","Rina suggested placing the brushes in a shared basket. Each child could use a brush for a few minutes and then return it for someone else. Students who were waiting could sketch their designs in pencil.","By the end of the meeting, everyone had worked on a poster. The group decided to use the same system at the next art club. Their new system made it easier for everyone to participate in the activity."],"main":"A fair sharing system helps everyone participate in art club.","detail":["How many paintbrushes did the club have?","Twelve","Six","Eighteen","Twenty-four","There were twelve brushes for eighteen children."],"cause":["Why did Rina propose a shared basket?","There were fewer brushes than children","The paintbrushes were all broken","Only one student wanted to paint","The club needed more pencils than paper","The club needed a way to take turns with limited supplies."],"infer":["What does the ending suggest about the new system?","Students thought it was fair and useful","Students decided to cancel art club","No one finished any poster","Students refused to take turns again","The group chose to repeat the system because everyone had participated."],"vocab":["participate","take part in an activity","watch from very far away","give up without trying","make something disappear"],"concepts":[["brushes","art","supplies"],["share","basket","turns"],["everyone","fair","participate"]]},{"level":1,"title":"A Nest Above the Door","genre":"Story","paragraphs":["A pair of swallows built a small nest above the door to a community building. People entering the building noticed the birds carrying bits of grass and mud to the same place every morning.","When visitors began walking close to the nest to take pictures, the birds flew away. A volunteer set a temporary rope several steps back and posted a note asking people to observe quietly from there.","Soon the swallows returned to feed their chicks. Visitors still enjoyed watching, but they did so without getting in the birds’ way."],"main":"Visitors learn to watch nesting birds from a respectful distance.","detail":["What materials did the swallows carry?","Grass and mud","Plastic toys and batteries","Paint and brushes","Paper tickets and string lights","The birds repeatedly carried grass and mud to build their nest."],"cause":["Why did the volunteer put up a rope?","To keep visitors from disturbing the nest","To make visitors climb higher","To stop the birds from feeding chicks","To hold the building door shut","A few visitors had approached so closely that the birds flew away."],"infer":["What is the most likely benefit of watching quietly?","The birds can care for their chicks with less disturbance","The birds will learn to speak to visitors","The nest will become larger every hour","The visitors can move the nest indoors","Keeping a distance helps birds continue their natural activities."],"vocab":["temporary","used for a limited time","made from heavy metal","impossible to move","found only in winter"],"concepts":[["birds","swallows","nest"],["rope","distance","quiet"],["chicks","feed","care"]]},{"level":1,"title":"The Class Weather Journal","genre":"Informational story","paragraphs":["Every morning, students in Room 14 looked out the same window and recorded the weather. They used symbols for sunny, cloudy, rainy, and windy days. They also measured the temperature on a classroom thermometer.","After a month, the class counted how often each weather symbol appeared. They discovered that their city had more sunny days than rainy days, although the coolest day had been sunny.","The teacher reminded students that one cool, sunny day did not mean all sunny days were cool. Patterns become easier to notice when observations are collected over time."],"main":"Weather records over time help students find patterns without making hasty conclusions.","detail":["What tool measured the temperature?","A thermometer","A ruler","A magnifying glass","A compass","Students measured temperature with a classroom thermometer."],"cause":["Why did the class record weather for a month?","To look for patterns across many days","To make it rain more often","To change the temperature outside","To choose a single favorite cloud","Many observations provide stronger evidence of patterns than one day alone."],"infer":["What does the teacher’s reminder suggest?","One example is not enough to prove a general rule","Sunny days are always the coldest","Weather can never be measured","All cities have identical weather","The teacher warned students not to generalize from one cool, sunny day."],"vocab":["patterns","things that repeat or show a trend","numbers chosen without looking","objects hidden in a drawer","stories about animals"],"concepts":[["weather","days","records"],["patterns","month","time"],["sunny","cool","conclusion"]],"visual":{"kind":"bars","title":"Weather Journal: 30 Days","labels":["Sunny","Cloudy","Rainy","Windy"],"values":[12,9,6,3],"question":"How many rainy days does the graph show?","correct":"6 days","wrong":["3 days","9 days","12 days"],"explain":"The Rainy bar reaches 6 on the vertical scale."}},{"level":2,"title":"How Bees Help Flowers","genre":"Informational","paragraphs":["When a bee lands on a flower to drink nectar, tiny grains of pollen may stick to its body. The bee then flies to another flower, carrying some of the pollen with it. This movement is called pollination.","Many flowering plants need pollen from other flowers to make seeds or fruits. Bees are not the only pollinators; butterflies, birds, and some bats also move pollen. Farmers sometimes place beehives near orchards to help fruit trees.","People can support pollinators by growing different kinds of flowers and avoiding unnecessary sprays that may harm insects."],"main":"Pollinators such as bees help many plants produce seeds and fruit.","detail":["What may stick to a bee as it visits a flower?","Pollen grains","Tiny stones","Tree bark","Flower pots","Pollen can cling to the bee’s body while it gathers nectar."],"cause":["Why do farmers sometimes keep beehives near orchards?","To help fruit trees receive pollen","To teach bees to build fences","To stop all flowers from growing","To make every tree grow taller overnight","Bees move pollen, supporting the production of fruit."],"infer":["What would most likely help bees in a neighborhood?","Planting a variety of flowers","Removing every flowering plant","Covering gardens with plastic","Spraying every insect repeatedly","A variety of flowers can provide food for pollinators."],"vocab":["pollination","the movement of pollen between flowers","the freezing of water into ice","a process that makes rocks smaller","the mixing of paint colors"],"concepts":[["bees","pollinator","pollen"],["flowers","seeds","fruit"],["garden","plant","help"]]},{"level":2,"title":"Why Some Bridges Have Arches","genre":"Informational","paragraphs":["An arch is a curved shape used in many bridges. When weight pushes down on the top of a strong arch, the force moves along the curve toward supports at each end. This design can help a bridge carry a heavy load.","Long ago, builders made arch bridges from carefully fitted stones. Today, some bridges use concrete or steel. Engineers must consider the river, the ground, the materials, and the number of travelers who will use the bridge.","No single bridge design is best for every location. A safe bridge depends on how its shape fits the place where it is built."],"main":"The curved shape of an arch can help distribute the weight a bridge carries.","detail":["Where does an arch direct much of the load?","Toward supports at both ends","Into the clouds above it","Only into the middle of the river","Into the road signs","An arch transfers force along its curve toward its supports."],"cause":["Why do engineers study the location before designing a bridge?","Different places require different safe designs","All bridges must look exactly the same","Only the bridge color matters","Rivers always stay the same depth","Conditions such as ground and traffic affect which design is safe."],"infer":["What can be inferred about a bridge built on weak ground?","Its supports may need special attention","Its shape will never matter","It should always be made only of glass","It will not need an engineer","If the ground matters to bridge design, weak ground requires careful planning."],"vocab":["supports","parts that hold something up","decorations that hide a shape","signs that name the builder","birds that live under a bridge"],"concepts":[["arch","bridge","curve"],["weight","load","supports"],["engineers","design","safe"]]},{"level":2,"title":"From Puddle to Cloud","genre":"Informational","paragraphs":["After a rainy day, sunlight warms puddles on the playground. Some liquid water changes into water vapor, a gas that rises into the air. This change is called evaporation.","High in the atmosphere, cooler air helps water vapor turn into tiny liquid droplets. The droplets collect in clouds. When they combine and become heavy enough, they fall as rain or snow.","This process is part of the water cycle. Water moves through the air, across the land, and through rivers and oceans, changing form as it travels."],"main":"Water changes form and moves through evaporation, clouds, and precipitation.","detail":["What makes puddles begin to evaporate?","Warmth from sunlight","The sound of traffic","Shadows from trees","A strong magnet","Sunlight warms puddles and helps water become vapor."],"cause":["Why does rain fall from some clouds?","Droplets combine and become heavy enough","Clouds touch the ground","All vapor turns directly into rocks","Wind stops all air movement","The passage says heavier combined droplets may fall as precipitation."],"infer":["What happens to the water in a puddle that disappears?","Some water enters the air as vapor","The water is destroyed forever","The water becomes sand","All the water goes into nearby plants instantly","Evaporation changes liquid water into an invisible gas; the water still exists."],"vocab":["evaporation","liquid water changing into water vapor","ice changing into stone","clouds turning into trees","soil collecting rainwater"],"concepts":[["water","vapor","evaporation"],["cloud","droplets","rain"],["cycle","move","change"]],"visual":{"kind":"flow","title":"The Water Cycle","labels":["Sun warms puddle","Evaporation","Cloud forms","Rain falls"],"question":"What comes immediately after evaporation in this diagram?","correct":"A cloud forms","wrong":["A new mountain forms","The water disappears forever","The cycle ends"],"explain":"Water vapor cools and forms tiny droplets that gather into clouds."}},{"level":2,"title":"Inside a Coral Reef","genre":"Informational","paragraphs":["Coral reefs may look like colorful underwater rocks, but they are built by tiny animals called coral polyps. Many polyps live together and form hard structures over long periods of time.","Reefs provide shelter and food for fish, crabs, and other sea creatures. Some fish hide among the coral branches when larger predators pass nearby. The reef is a busy habitat, even though it cannot move from place to place.","Warmer ocean water and pollution can harm coral. Scientists and local communities work to reduce damage because healthy reefs support many kinds of life."],"main":"Coral reefs are living habitats that shelter many ocean animals.","detail":["What tiny animals build coral reefs?","Coral polyps","Sea turtles","Dolphins","Seagulls","Coral reefs are formed by colonies of tiny coral polyps."],"cause":["Why do some fish hide among coral branches?","To avoid larger predators","To find schoolbooks","To breathe air above the ocean","To escape sunlight on land","Coral branches provide shelter from animals that might eat the fish."],"infer":["Why would damaged coral affect other animals?","Many species depend on the reef for shelter and food","All fish can live only in fresh water","Coral is the only source of ocean waves","Reefs cause rain to fall","If the habitat is harmed, animals that depend on it may lose resources."],"vocab":["habitat","the natural place where an organism lives","a kind of fishing boat","a bright ocean color","a tool for measuring salt"],"concepts":[["coral","reef","polyps"],["fish","shelter","habitat"],["warm","pollution","protect"]]},{"level":2,"title":"The Secret of a Sundial","genre":"Informational","paragraphs":["Before electronic clocks, people sometimes used sundials to estimate the time. A sundial has a raised part that casts a shadow onto a marked surface. As the Sun appears to move across the sky, the shadow changes direction.","Sundials work best on sunny days and must be placed carefully. A sundial marked for one location may not give accurate readings if it is moved far away without adjustment.","Unlike a digital clock, a sundial cannot show the time at night. Still, it teaches us how people used observations of nature to solve everyday problems."],"main":"Sundials use the changing position of sunlight and shadows to tell time.","detail":["What moves across the marked surface of a sundial?","A shadow","A clock battery","A drop of rain","A spinning wheel","The shadow shifts as sunlight changes direction."],"cause":["Why is a sundial not useful for telling time at night?","There is no direct sunlight to cast its usual shadow","Its numbers disappear every evening","The ground becomes too soft","The Sun moves faster after dark","Without sunlight, the sundial cannot create the shadow it uses."],"infer":["What does the sundial show about people long ago?","They observed nature to solve practical problems","They never needed to know the time","They used only digital devices","They could control the Sun’s movement","A sundial is an example of using natural patterns as a useful tool."],"vocab":["estimate","make a close guess using available information","know a number without thinking","replace one object with another","make something completely silent"],"concepts":[["sundial","sun","shadow"],["time","mark","read"],["observe","nature","tool"]]},{"level":2,"title":"Why Desert Plants Look Different","genre":"Informational","paragraphs":["Deserts usually receive very little rain. To survive, plants must save water or collect it quickly when rain falls. Some cacti store water in thick stems, while others have roots that spread widely near the surface.","Many desert plants have small leaves or spines instead of large, thin leaves. These features can reduce water loss. A waxy coating on some stems also helps keep moisture inside.","Desert plants do not all look the same, but their different features often help them manage the same challenge: a lack of water."],"main":"Desert plants have different features that help them survive with little water.","detail":["Where do some cacti store water?","In thick stems","Inside flower petals only","In rocks beside their roots","In the air above them","Some cacti have thick stems that store water."],"cause":["Why do some desert plants have spines or small leaves?","They can reduce water loss","They make rain fall every day","They attract snowstorms","They stop roots from growing","Smaller leaf surfaces can reduce the amount of moisture lost."],"infer":["What can be inferred about a plant with a waxy stem?","It may lose less water through its surface","It must live only underwater","It cannot survive any sunlight","It never needs roots","A waxy coating helps preserve moisture."],"vocab":["moisture","a small amount of water or wetness","a kind of desert animal","a warm wind from the sea","the color of a plant"],"concepts":[["desert","dry","rain"],["stem","roots","spines"],["water","save","survive"]]},{"level":2,"title":"How a Compost Bin Works","genre":"Informational","paragraphs":["A compost bin turns fruit peels, dry leaves, and other plant scraps into material that helps soil. Tiny organisms break down the scraps over time. Air and moisture help these decomposers do their work.","Gardeners often mix soft green scraps with dry brown materials. They turn the pile so air can reach different parts. After several months, the scraps may become dark, crumbly compost.","Compost does not replace every plant’s need for sunlight or water. Instead, it improves soil and keeps many plant scraps out of the trash."],"main":"Composting uses decomposers to turn plant scraps into useful soil material.","detail":["What kind of scraps can go into the compost described?","Fruit peels and dry leaves","Glass bottles and batteries","Plastic toys and metal nails","Paint cans and rubber tires","The passage names fruit peels and dry leaves as compost materials."],"cause":["Why do gardeners turn a compost pile?","To let air reach more of the material","To make the compost glow","To freeze all the organisms","To remove every drop of moisture","Turning the pile helps decomposers receive air."],"infer":["Why might a school start composting cafeteria fruit scraps?","It could reduce waste and improve garden soil","It would remove the need to water plants","It would make plastic disappear instantly","It would stop all insects from living nearby","Composting keeps plant scraps out of the trash and creates soil material."],"vocab":["decomposers","living things that break down dead material","machines that print labels","birds that build nests","rocks that store sunlight"],"concepts":[["compost","scraps","leaves"],["organisms","break","down"],["soil","garden","waste"]]},{"level":2,"title":"The Work of a Crossing Guard","genre":"Informational","paragraphs":["At a busy intersection near a school, crossing guards help children cross safely. They watch traffic, wait for the right signal, and remind walkers to stay inside the marked crosswalk.","Guards wear bright clothing so drivers can see them. They cannot make cars disappear, so students must also pay attention, avoid running, and follow directions.","Crossing guards are one part of a larger safety system that includes traffic lights, road markings, drivers, and pedestrians."],"main":"Crossing guards and careful pedestrians work together for safety.","detail":["Where do guards tell students to walk?","Inside the marked crosswalk","Between parked cars","Down the center of the road","Across the grass median","Students should stay within the marked crossing area."],"cause":["Why do crossing guards wear bright clothing?","So drivers can see them more easily","So traffic lights become brighter","So students can ignore traffic","So rain cannot reach their clothes","Visible clothing helps others notice the guard in traffic."],"infer":["What should students do even when a guard is present?","Remain alert and follow directions","Run into the street without looking","Ignore road signs","Walk outside the crosswalk","The article explains that safety is shared by guards, drivers, and pedestrians."],"vocab":["pedestrians","people traveling on foot","drivers of large buses","workers building roads","people riding airplanes"],"concepts":[["crossing","guard","students"],["crosswalk","traffic","signal"],["safety","pay","attention"]]},{"level":2,"title":"The Journey of a Library Book","genre":"Informational","paragraphs":["Libraries use systems to help many people share books. When a reader checks out a book, a computer records the title and the date it should be returned. The book then travels home with the reader.","After the book comes back, a library worker checks its condition and returns it to the correct shelf. Readers can search the catalog to learn whether a title is available.","This careful process helps prevent books from getting lost and makes it possible for the same story to be enjoyed by many readers."],"main":"Libraries track, return, and organize books so many people can use them.","detail":["What does the library computer record during checkout?","The title and return date","The reader’s favorite color","The weather on the next weekend","The number of classroom windows","The checkout record includes a book’s title and its due date."],"cause":["Why are returned books placed on the correct shelves?","So other readers can find them","So books will become heavier","So the lights will stay on","So no one can borrow them again","Correct shelving makes books easier to locate."],"infer":["What would probably happen if books were shelved randomly?","Readers would have more trouble finding them","Books would turn into magazines","The catalog would no longer need titles","No readers would ever visit","The system depends on organizing each title in a predictable place."],"vocab":["catalog","a searchable list of library materials","a basket of wet leaves","a tool that measures time","a map of rivers"],"concepts":[["library","books","reader"],["checkout","return","date"],["shelf","catalog","find"]],"visual":{"kind":"flow","title":"Library Book Journey","labels":["Check out","Take home","Return","Put on shelf"],"question":"According to the diagram, what happens after a book is returned?","correct":"It is put back on a shelf","wrong":["It is always thrown away","It is taken on a bus","It is turned into a newspaper"],"explain":"Returned books are checked and then placed on their correct shelves."}},{"level":2,"title":"Two Ways to Save Water","genre":"Informational","paragraphs":["A family can save water in many small ways. Turning off the faucet while brushing teeth prevents clean water from running down the drain. Repairing a dripping tap can also prevent water from being wasted day after day.","Outside, gardeners may use a watering can to deliver water close to plant roots. They can also cover soil with mulch to slow evaporation on hot afternoons.","Each action saves a different amount, but all of them follow the same idea: use only the water that is needed. These are practical ways to conserve water at home."],"main":"Small indoor and outdoor habits can reduce water waste.","detail":["What helps slow evaporation from garden soil?","A layer of mulch","A running kitchen faucet","A bright desk lamp","A metal spoon","Mulch covers the soil and helps keep moisture from escaping quickly."],"cause":["Why should a family repair a dripping tap?","Water is wasted even when no one is using it","Drips make plants grow faster indoors","A tap can turn into a garden hose","The sink will no longer need cleaning","A small leak can waste water over many days."],"infer":["Which action fits the article’s advice?","Turn off the tap while brushing teeth","Leave the tap running during meals","Water the sidewalk each afternoon","Remove mulch on the hottest day","Turning off unnecessary flow prevents water waste."],"vocab":["conserve","save and use carefully","spill on purpose","mix with dirt","paint a bright color"],"concepts":[["water","save","waste"],["faucet","tap","drip"],["mulch","soil","evaporation"]],"visual":{"kind":"flow","title":"Simple Water-Saving Habits","labels":["Turn off tap","Fix leaks","Use mulch"],"question":"Which picture-label names a way to save water outdoors?","correct":"Use mulch","wrong":["Leave the tap running","Ignore a leaking faucet","Water the sidewalk"],"explain":"Mulch slows the evaporation of moisture from garden soil."}},{"level":2,"title":"Where Food Comes From","genre":"Informational","paragraphs":["Before a strawberry reaches a grocery store, a farmer grows the plant and cares for its fruit. When the berries are ripe, workers pick them and pack them carefully to prevent bruises.","Trucks carry the fruit to markets, where workers place it in cool areas. Customers then choose berries to take home. Each step requires people, time, and transportation.","Learning about this journey reminds us that a simple snack may depend on the work of many people we never meet."],"main":"Growing and delivering food takes several steps and many workers.","detail":["What happens before strawberries are placed on a truck?","They are picked and packed","They are cooked into soup","They are buried in sand","They are turned into seeds again","Workers harvest ripe berries and pack them for transport."],"cause":["Why are berries packed carefully?","To prevent bruising","To make them grow new leaves","To remove their flavor","To turn them blue","Careful packing protects delicate fruit during transportation."],"infer":["What can a student infer about food delivery?","A grocery item often depends on many workers","All food appears in stores without travel","Farmers never use transportation","Only cashiers help customers eat","The passage lists farmers, pickers, truck drivers, and market workers."],"vocab":["transportation","moving people or goods between places","growing seeds without soil","putting names on books","measuring the temperature"],"concepts":[["fruit","strawberries","food"],["farm","pick","pack"],["truck","market","workers"]]},{"level":2,"title":"How Sound Travels","genre":"Informational","paragraphs":["When a drum is struck, its surface vibrates. Vibrations travel through the surrounding air as sound waves until they reach a listener’s ears. Sounds can also travel through solids and liquids.","At a school concert, a student near the drum may hear a stronger sound than someone standing far away. A wall can block or change some sound, but it may not stop every vibration.","This is why people use different materials to make quiet rooms and why musicians think carefully about where an instrument is placed."],"main":"Sound begins with vibrations and travels through materials to listeners.","detail":["What vibrates when someone strikes a drum?","The drum’s surface","Only the concert tickets","The auditorium clock","The paper on the wall","The surface of the drum vibrates and makes sound waves."],"cause":["Why might a student close to the drum hear it more strongly?","The sound has traveled a shorter distance","Sound waves only move upward","Air disappears near the stage","The drum changes instruments","Sound often becomes weaker as it travels farther from its source."],"infer":["What might help make a room quieter?","Using materials that absorb sound","Adding more drums to the room","Opening every loudspeaker","Removing every wall","Materials can change how sound travels and how much reaches listeners."],"vocab":["vibrates","moves back and forth quickly","changes color every hour","drinks water slowly","stays perfectly still"],"concepts":[["sound","waves","vibration"],["air","material","travel"],["drum","hear","distance"]]},{"level":3,"title":"The Empty Bird Feeder","genre":"Story","paragraphs":["Elena filled the backyard bird feeder every Saturday. One morning, she noticed that the seeds were gone much sooner than usual. At first she blamed the larger birds, which sometimes crowded out the smaller ones.","Her family set a camera facing the feeder. The recording showed a squirrel leaping from a fence and spilling seeds onto the ground. Instead of chasing the squirrel, Elena moved the feeder farther from the fence and placed a tray beneath it.","After a week, fewer seeds were wasted. Elena learned that collecting evidence can be more useful than guessing what caused a problem."],"main":"Elena uses evidence to solve a bird-feeder mystery.","detail":["What revealed why the seeds disappeared?","A camera recording","A note from a neighbor","A weather forecast","A library catalog","The recording showed a squirrel spilling the seeds."],"cause":["Why did Elena move the feeder away from the fence?","To make it harder for the squirrel to jump onto it","To attract larger birds to the fence","To prevent birds from seeing food","To make the camera disappear","The squirrel had jumped from the fence, so moving the feeder reduced access."],"infer":["What lesson did Elena learn?","Test an idea with evidence before deciding","Always blame the biggest animal","Never watch animals closely","Cameras can predict the weather","Her first guess was wrong; video evidence led to a better solution."],"vocab":["evidence","information that helps show what is true","a reason to give up","a tool for digging holes","an object that makes noise"],"concepts":[["squirrel","feeder","seeds"],["camera","recording","evidence"],["move","tray","solution"]]},{"level":3,"title":"The Mystery of the Cool Hallway","genre":"Story","paragraphs":["During a hot afternoon, Theo noticed that the school hallway felt cooler than the blacktop playground. The hallway had open windows on opposite sides, but the playground was in direct sunlight.","Theo and his classmates used thermometers to measure both places at the same time. They discovered that the shaded hallway had a lower temperature. They also felt a breeze traveling through the open windows.","Their teacher explained that shade and moving air can both change how warm a place feels. Theo wrote two possible reasons in his science notebook instead of claiming that only one factor mattered."],"main":"Theo investigates why a shaded, breezy hallway feels cooler than a playground.","detail":["What tool did students use to compare the two places?","Thermometers","Magnets","Paintbrushes","Rulers","The students measured temperatures at both locations with thermometers."],"cause":["Why might the hallway have felt cooler?","It had shade and moving air","Its floor was made of gold","It had more students outside","Its windows were painted black","Shade limited direct sunlight, and open windows allowed airflow."],"infer":["What does Theo’s notebook show?","He considers more than one possible explanation","He already proved a single cause","He does not trust any measurement","He wants the school to close","He recorded two factors rather than jumping to one conclusion."],"vocab":["factor","something that can influence a result","a kind of playground game","a number with no meaning","a piece of art paper"],"concepts":[["hallway","playground","cool"],["shade","breeze","air"],["measure","temperature","factor"]]},{"level":3,"title":"A Different Kind of Trophy","genre":"Story","paragraphs":["At the school reading challenge, students earned points for finishing books. Amir had read fewer books than many classmates. He was disappointed because he had spent nearly two weeks on a long mystery novel.","His teacher asked him to explain the novel’s clues and surprising ending. Amir spoke for several minutes, showing that he had thought carefully about the story. The teacher created an additional award for thoughtful reading reflections.","Amir still wanted to read more books, but he no longer believed that the number of titles told the whole story of someone’s reading."],"main":"Careful understanding matters as well as the number of books read.","detail":["What kind of book had Amir been reading?","A long mystery novel","A cookbook about desserts","A short picture dictionary","A book of weather charts","The passage identifies Amir’s book as a long mystery novel."],"cause":["Why did the teacher create another award?","To recognize thoughtful reading, not only quantity","To stop students from reading novels","To give every child the same score","To count the pages in schoolbooks","Amir demonstrated deep understanding even with fewer finished books."],"infer":["What might Amir value more after the challenge?","The quality of his reading and reflection","Only how quickly he finishes a book","Avoiding all difficult novels","Never discussing a story","The ending shows he realizes the book count does not measure everything."],"vocab":["reflections","thoughts about an experience or idea","shiny objects on a window","times when a clock stops","instructions for a race"],"concepts":[["reading","books","novel"],["understand","thoughtful","reflection"],["award","quantity","quality"]]},{"level":3,"title":"The Town’s New Trees","genre":"Informational story","paragraphs":["A town council proposed planting new trees along a busy street. Some neighbors supported the plan because trees could provide shade and make the sidewalk more pleasant. Others worried that roots might lift the pavement.","The council listened to both groups and asked an arborist to recommend tree species with roots suited to narrow planting areas. The plan was updated to include smaller trees and extra space around their bases.","Most neighbors approved the revised plan. The discussion showed how people can solve a shared problem by considering both benefits and concerns."],"main":"A town improves a tree-planting plan by considering different viewpoints.","detail":["Who recommended suitable tree species?","An arborist","A bus driver","A lifeguard","A librarian","An arborist is a tree specialist consulted by the council."],"cause":["Why were some neighbors concerned about the new trees?","Roots might damage the sidewalk","Trees would remove all shade","Leaves would make the road disappear","The street was completely empty","Neighbors worried that growing roots could lift pavement."],"infer":["What does the revised plan show?","Compromise can address competing needs","Every concern should be ignored","The council did not listen to anyone","Only the first idea can ever work","The council changed its design in response to expert advice and residents’ concerns."],"vocab":["revised","changed or improved after review","copied without looking","painted red for a holiday","hidden from everyone"],"concepts":[["trees","sidewalk","roots"],["neighbors","concerns","benefits"],["plan","revise","compromise"]]},{"level":3,"title":"The Broken Museum Label","genre":"Story","paragraphs":["On a class museum visit, Jada saw a model of an ancient sailing ship. The label beside the model was torn, and only a few words could be read. Jada wondered how sailors had found their way before modern navigation devices.","Instead of inventing an answer, she searched the exhibit guide. It explained that many sailors observed stars, coastlines, and wind patterns. Her group then compared the guide with a nearby drawing of a compass.","Jada wrote a short explanation based on the information she found. Her teacher praised the group for identifying a reliable source when a label was incomplete."],"main":"Jada uses a museum guide to find evidence instead of guessing.","detail":["What was damaged in the ship exhibit?","The information label","The museum roof","The ship’s sails","The classroom computer","The label by the model was torn and incomplete."],"cause":["Why did Jada consult the exhibit guide?","The label did not give enough information","She wanted to find the gift shop","Her group was looking for lunch","The drawing had disappeared","The guide supplied details missing from the damaged label."],"infer":["What made Jada’s explanation reliable?","She based it on information from a source","She copied a guess from a friend","She ignored the exhibit entirely","She used only her imagination","She checked the exhibit guide before writing her answer."],"vocab":["navigation","finding and following a route","building a wooden chair","sorting recycled paper","counting plants in a garden"],"concepts":[["museum","exhibit","label"],["sailors","stars","navigation"],["guide","source","evidence"]]},{"level":3,"title":"The Park Bench Debate","genre":"Story","paragraphs":["The community park had a space near a walking trail. Some visitors wanted a new bench there, while others suggested a small flower garden. The parks committee could afford only one project that month.","At a meeting, people explained their reasons. Older walkers said a bench would provide a place to rest. Garden supporters said flowers would attract butterflies. A student suggested placing a bench by an existing flower bed.","The committee accepted the student’s idea. It would provide a resting place without losing the chance to enjoy flowers."],"main":"A creative compromise meets two different needs in a park.","detail":["What two projects were people discussing?","A bench and a flower garden","A pool and a basketball court","A road and a bridge","A library and a theater","The committee debated adding a bench or planting flowers."],"cause":["Why did some visitors want a bench?","Walkers needed a place to rest","They wanted to stop flowers from growing","The park was always closed","They hoped to block the trail","Older walkers explained that a bench would offer rest."],"infer":["Why was the student’s suggestion effective?","It combined a resting place with existing flowers","It required removing the whole park","It ignored everyone’s concerns","It made the committee spend twice its budget","A bench beside existing flowers addressed both groups without a new garden."],"vocab":["committee","a group of people assigned to make decisions","a small kind of flower","a basket used for planting","a map of walking trails"],"concepts":[["park","bench","flowers"],["walkers","rest","butterflies"],["compromise","combine","needs"]]},{"level":3,"title":"What the Footprints Revealed","genre":"Story","paragraphs":["After fresh snow fell, Micah noticed tiny footprints near the birdbath. The tracks crossed the garden and ended beneath a shrub. He wondered which animal had passed through during the night.","Micah compared the prints with pictures in a field guide. The guide showed that rabbit tracks often appear in groups of four, with larger back-foot prints ahead of smaller front-foot prints. The marks in his garden matched that pattern.","He could not be completely certain without seeing the animal, but he recorded “probably a rabbit” in his notebook and drew the tracks. His inference was supported by tracks, even though he had not seen the animal."],"main":"Micah uses tracks and a guide to make a careful inference about an animal.","detail":["Where did the tracks end?","Beneath a shrub","Inside the birdbath","On the kitchen roof","At the bus stop","The trail of footprints ended under a shrub."],"cause":["Why did Micah compare the prints with a field guide?","To identify the animal from a pattern","To learn how to shovel snow","To find the time of sunrise","To decide where to plant trees","A guide helped him compare visible evidence with known rabbit tracks."],"infer":["Why did Micah write “probably” instead of “definitely”?","He had evidence but had not seen the animal","He had seen three rabbits running","He disliked using the guide","The tracks had become larger than the house","Matching tracks suggests an answer but does not prove the animal’s identity."],"vocab":["inference","a conclusion based on clues and what you know","a rule about spelling","a picture made with paint","a number measured by a clock"],"concepts":[["snow","footprints","tracks"],["rabbit","pattern","guide"],["probably","clue","inference"]]},{"level":3,"title":"When the Stream Turned Brown","genre":"Informational story","paragraphs":["After a heavy storm, a creek near the school looked brown instead of clear. Several children thought the water had become dirty because someone had poured paint into it. Their teacher suggested investigating other explanations.","The class visited a safe observation area and noticed soil washing downhill toward the creek. They learned that strong rain can carry loose sediment into flowing water. The particles may make water cloudy even without paint.","The students reported what they had observed, but they did not claim the water was safe to drink. A cloudy stream can have several possible causes, and water safety requires proper testing."],"main":"Students use observations to explain cloudy stream water without making unsupported claims.","detail":["What was washing downhill toward the creek?","Loose soil","Fresh paint from the classroom","Plastic chairs","Library books","The class observed loose soil moving toward the stream."],"cause":["Why did the water look brown after the storm?","Rain carried sediment into the creek","The creek suddenly froze solid","The sky reflected a purple sunset","Fish stirred in artificial coloring","Sediment particles in the water can make it look cloudy or brown."],"infer":["Why did students avoid saying the stream was safe to drink?","Appearance alone cannot establish water safety","Brown water is always safe","Their teacher had removed the stream","All rainwater is perfectly clean","Testing is needed to determine safety; looking alone is not enough."],"vocab":["sediment","small pieces of soil or rock carried by water","a kind of waterproof shoe","a plant that only grows in winter","the edge of a bridge"],"concepts":[["storm","rain","creek"],["soil","sediment","brown"],["observe","testing","safe"]]},{"level":3,"title":"The School Newsletter","genre":"Story","paragraphs":["Rosa was editing the school newsletter. A classmate wrote that the new playground was “the best playground in the entire state.” Rosa liked the playground, but she could not find evidence for such a large claim.","She asked the writer to add specific details instead. The revised article described the new climbing ropes, shaded seating, and safer walking path. It also included a quote from a student who enjoyed the equipment.","The published newsletter sounded enthusiastic without pretending that one school had tested every playground in California."],"main":"A writer strengthens a newsletter article by replacing an unsupported claim with evidence.","detail":["Which detail appeared in the revised article?","New climbing ropes","A new indoor swimming pool","A train station","An outdoor movie theater","The revision included climbing ropes, shade, and a walking path."],"cause":["Why did Rosa question “the best in the entire state”?","There was no evidence for the comparison","She wanted to remove all positive comments","The playground had no equipment","The article had too many pictures","A statewide superlative requires evidence the writer did not have."],"infer":["Why is the revised article more trustworthy?","It provides observable details and a quoted opinion","It removes every fact from the article","It compares schools without measurements","It says nobody likes the playground","Specific features and an attributed quote support a balanced description."],"vocab":["claim","a statement presented as true","a tool for joining paper","a photograph of a field","a kind of school lunch"],"concepts":[["newsletter","article","writer"],["claim","evidence","details"],["playground","revision","quote"]],"visual":{"kind":"compare","title":"Claim vs. Evidence","labels":["Broad claim","Supported details"],"values":["Best in the whole state!","Ropes, shade, safer path"],"question":"Which wording is better supported by the article?","correct":"The playground has ropes, shade, and a safer path","wrong":["It is the best playground in the state","Every student loves it","No other playground has climbing equipment"],"explain":"The passage lists observable features, but offers no statewide comparison."}},{"level":3,"title":"The Last Piece of Cake","genre":"Story","paragraphs":["Two cousins, Ben and Isla, reached for the last slice of cake at the same time. Ben said he had been waiting longer. Isla pointed out that she had helped bake it. Their voices began to grow louder.","Grandma placed the cake on a plate and asked each child what mattered most. Ben wanted some of the chocolate frosting, while Isla wanted to taste the strawberry filling. Grandma cut the slice so each cousin received the part they cared about.","The cousins laughed at how quickly the argument ended once they explained what they actually wanted. Their disagreement had been about different favorite parts of the cake."],"main":"Listening to each person’s needs helps solve a disagreement.","detail":["What did Ben especially want?","Chocolate frosting","Strawberry filling","A second whole cake","A glass of orange juice","Ben specifically wanted the chocolate frosting."],"cause":["Why did Grandma ask what mattered most?","To understand what each cousin wanted","To make the cousins argue longer","To choose a new cake recipe","To send everyone outside","Knowing the real interests made an acceptable solution possible."],"infer":["What can be inferred about the disagreement?","The cousins wanted different parts, not necessarily the entire slice","Both wanted only the strawberry filling","Neither cousin liked cake","Grandma had no way to help","Once each person named a preferred part, the cake could be shared."],"vocab":["disagreement","a situation in which people have different opinions","a game with a single winner","a type of birthday candle","a fruit used in baking"],"concepts":[["cousins","cake","slice"],["frosting","filling","parts"],["listen","share","solve"]]},{"level":3,"title":"A Message from the Past","genre":"Informational","paragraphs":["Time capsules are containers filled with objects or messages intended for people to discover years later. A class might include a photograph, a list of favorite games, or a letter describing school life.","The items tell future readers what daily life was like at one moment in history. However, the contents reflect the choices of the people who made the capsule. A single capsule cannot represent the experience of everyone living at that time.","Historians compare capsules with photographs, newspapers, and other records to form a fuller picture of the past."],"main":"Time capsules provide clues about the past but show only a limited viewpoint.","detail":["Which item might a class place in a time capsule?","A letter about school life","Fresh ice cream without a container","A living tree with deep roots","A bowl of hot soup","A letter could record everyday experiences for future readers."],"cause":["Why do historians compare time capsules with other records?","One capsule cannot represent everyone’s experiences","All time capsules contain false information","Photographs cannot record anything","Capsules can only be opened immediately","Other sources supply perspectives that one group may have missed."],"infer":["What can be inferred about a capsule made by one student?","It may reflect that student’s interests more than everyone’s","It must describe every family equally","It can predict the future perfectly","It contains no useful information","The objects selected depend on the creator’s personal choices."],"vocab":["represent","stand for or show something","hide something forever","erase a photograph","move a heavy object"],"concepts":[["time","capsule","past"],["objects","letter","clues"],["perspective","limited","compare"]]},{"level":3,"title":"Learning from a Failed Launch","genre":"Story","paragraphs":["The science club tested small paper rockets propelled by air. A group called their design the Sky Arrow because its tall nose pointed straight upward. During the first trial, however, the rocket spun sideways.","They noticed that one paper fin was shorter than the others. After rebuilding the fins to the same size, they launched the rocket again. This time it traveled in a straighter path, though it did not fly the farthest.","The students recorded both attempts and wrote that a fair test should change one important feature at a time."],"main":"The science club improves a rocket by identifying and correcting an uneven fin.","detail":["What was wrong with the rocket’s first design?","One fin was shorter than the others","The rocket was made of heavy steel","The rocket had no paper at all","Its nose was shaped like a wheel","The uneven paper fins helped explain the sideways spin."],"cause":["Why did the group change the fins to equal sizes?","To test whether balance would improve the flight","To make the rocket heavier with water","To keep the rocket from leaving the table","To replace the air launcher with a motor","Equal fins were an attempt to correct the suspected cause of spinning."],"infer":["What can we infer about the students’ method?","They value controlled changes and careful records","They believe the first launch is always best","They refuse to compare trials","They measure success only by rocket color","The group changed a specific feature and documented both attempts."],"vocab":["trial","a test or attempt","a place for storing books","a kind of bird feather","the final answer to a question"],"concepts":[["rocket","fins","launch"],["balance","straight","spin"],["test","change","record"]]},{"level":4,"title":"The Mountain Wore a Blanket","genre":"Literary","paragraphs":["At sunrise, a blanket of mist rested on the mountain behind the village. From her porch, Hana watched the pale fog drift between the pine trees. “The mountain is still sleeping,” her grandmother whispered.","By midmorning, sunlight had warmed the valley and the mist began to lift. The dark rock face appeared, followed by a narrow trail that wound toward the summit. Hana knew the mountain had not actually been asleep, but Grandma’s words made the peaceful morning feel alive.","She wrote the phrase in her notebook, hoping to use it in a poem about the changing sky."],"main":"Figurative language helps Hana imagine a misty mountain as a sleeping person.","detail":["What covered the mountain at sunrise?","Mist or fog","A layer of fresh paint","A blanket carried by hikers","A cloud of butterflies","A blanket of mist is the writer’s description of fog."],"cause":["Why did the trail become visible later?","Sunlight warmed the valley and the mist lifted","Someone built the trail that morning","The mountain moved closer to the village","The pines lost all their needles","As fog cleared, the hidden rock and trail could be seen."],"infer":["What does “the mountain is still sleeping” suggest?","The scene is quiet and peaceful","The mountain is a living animal","The village must close for winter","The trail is too dangerous to visit","Grandma personifies the mountain to create a calm mood."],"vocab":["drift","move slowly through the air","run as quickly as possible","sink into a hole","make a very loud sound"],"concepts":[["mountain","mist","fog"],["sleeping","quiet","peaceful"],["figurative","poem","words"]]},{"level":4,"title":"A Letter to Tomorrow","genre":"Literary","paragraphs":["Milo wrote a letter to his future self as part of an assignment. He described how nervous he felt before joining the school band and how excited he had become after learning three songs on the trumpet.","He sealed the note in an envelope marked “Open next spring.” In the last line, he wrote, “I hope you remember that a shaky first note is still a beginning.” Then he placed it in the classroom box.","As he walked home, Milo thought less about mistakes and more about how much practice could change him before the letter was opened."],"main":"Milo encourages his future self to see mistakes as the beginning of growth.","detail":["What instrument was Milo learning?","The trumpet","The violin","The piano","The flute","Milo had learned three songs on the trumpet."],"cause":["Why did Milo write “a shaky first note is still a beginning”?","He wanted to remember that improvement starts with trying","He wanted to stop playing music","He believed every musician must play perfectly","He forgot when the band rehearsed","The phrase connects an imperfect first attempt with later progress."],"infer":["What can we infer about Milo’s attitude at the end?","He is becoming more hopeful about practice","He is more afraid of trying than before","He has decided to quit the band","He believes the letter cannot be opened","He begins focusing on future improvement rather than mistakes."],"vocab":["shaky","unsteady or uncertain","painted a bright color","made from a heavy metal","already completely perfect"],"concepts":[["letter","future","spring"],["band","trumpet","music"],["practice","improve","beginning"]]},{"level":4,"title":"The Quiet Applause","genre":"Literary","paragraphs":["During the talent show, Naomi stepped onto the stage carrying a violin. Her hands trembled as she lifted the bow. She had practiced for weeks, but the rows of faces made her forget the opening notes.","From the second row, her friend Eli nodded and silently moved his fingers as if playing along. Naomi took a slow breath, remembered the melody, and began. She made a small mistake near the end but finished the song.","The audience applauded. Naomi noticed that Eli was clapping quietly, with a smile that seemed to say, “You did it.” She understood that encouragement does not always need words."],"main":"Quiet encouragement helps Naomi regain confidence during a performance.","detail":["What instrument did Naomi perform with?","A violin","A saxophone","A drum","A guitar","Naomi carried a violin and played with a bow."],"cause":["Why did Naomi pause at the beginning?","The audience made her nervous","Her instrument had broken","She forgot to practice any song","The lights went out","Seeing many faces caused her to forget the opening notes briefly."],"infer":["What does Eli’s silent gesture show?","A friend can offer support without speaking","Eli wanted to stop Naomi’s song","The audience could not hear the violin","Eli was trying to become the performer","His nod and finger movements helped her remember the music."],"vocab":["trembled","shook slightly","rested without moving","became much larger","made a bright light"],"concepts":[["Naomi","violin","stage"],["Eli","friend","encourage"],["confidence","song","finish"]]},{"level":4,"title":"Two Sides of the Fence","genre":"Literary","paragraphs":["A wooden fence separated Mr. Bell’s garden from the apartment building next door. Mr. Bell thought the fence was too low because basketballs sometimes bounced into his vegetables. Children on the other side thought the fence made their play area feel small.","One Saturday, everyone met to discuss the problem. The children offered to move their basketball hoop farther from the fence. Mr. Bell agreed to add a small gate so they could retrieve a lost ball without climbing over the plants.","Both sides realized that the fence had looked like a different problem depending on where a person stood. Each viewpoint made more sense after the neighbors listened."],"main":"People with different viewpoints solve a shared fence problem by listening.","detail":["What sometimes landed in Mr. Bell’s garden?","Basketballs","School backpacks","Bicycles","Paintbrushes","Balls bounced over the fence into his vegetables."],"cause":["Why did the children move the hoop?","To reduce balls flying into the garden","To make the fence disappear","To stop Mr. Bell from gardening","To turn the play area into a parking lot","Moving the hoop lowered the chance of balls crossing the fence."],"infer":["What is the meaning of the final sentence?","The same situation can feel different to different people","The fence actually changes height each day","Only children can understand gardens","Neighbors must always agree immediately","The two groups judged the fence from different experiences and needs."],"vocab":["viewpoint","the way someone thinks about a situation","the exact height of a wall","a tool for cutting wood","a type of garden vegetable"],"concepts":[["fence","garden","balls"],["children","neighbor","viewpoints"],["talk","gate","solution"]]},{"level":4,"title":"The Library After Closing","genre":"Literary","paragraphs":["On the night of the school fundraiser, the library seemed to whisper. Of course, the books could not talk. The soft rustling came from volunteers stacking donated pages and boxes.","Samara had never stayed in the library after sunset. Without busy students, she noticed the ticking clock and the faint scent of old paper. Her father switched on a lamp, making the rows of shelves glow warmly.","Samara decided that the room did not feel empty at all. It was filled with stories waiting quietly for their next readers."],"main":"The author uses personification and sensory details to create a peaceful library mood.","detail":["Why were volunteers in the library after closing?","They were preparing for a fundraiser","They were searching for a lost dog","They were replacing every window","They were painting the playground","The library was being prepared for a school fundraiser."],"cause":["Why did the library seem to whisper?","Soft sounds of rustling paper filled the quiet room","Books had begun speaking aloud","A loud concert was playing","Samara heard a thunderstorm outdoors","The “whisper” is figurative language for quiet rustling sounds."],"infer":["What mood does the writer create?","Calm and slightly magical","Angry and dangerous","Fast and noisy","Bitter and hopeless","The warm lamp, ticking clock, and waiting stories create a gentle mood."],"vocab":["faint","not strong or easy to notice","extremely loud","very bright and sharp","impossible to remember"],"concepts":[["library","books","stories"],["whisper","rustling","quiet"],["warm","peaceful","mood"]]},{"level":4,"title":"A Map with No Treasure","genre":"Literary","paragraphs":["Ari found an old hand-drawn map inside a drawer. An X marked a spot beneath the oak tree, so he imagined a box of coins buried in the yard. He and his sister followed the faded lines until they reached the tree.","After carefully digging in the soft soil, they uncovered a small tin filled with photographs, postcards, and a note from their grandfather. The note said he had hidden his happiest memories for his grandchildren to discover.","Ari stared at the pictures longer than he had expected. He decided that the map had led to treasure after all, just not the kind he first imagined."],"main":"Ari learns that family memories can be more valuable than money.","detail":["What did the children find beneath the tree?","A tin with photographs and postcards","A chest of silver coins","A bag of new toys","A small television","The buried tin contained family pictures and postcards."],"cause":["Why did Ari initially expect coins?","The X on the old map suggested buried treasure","His grandfather had promised money","He found a bank receipt","His sister bought a metal detector","A marked X made Ari imagine a traditional treasure chest."],"infer":["What is the deeper meaning of “treasure” at the end?","Family memories are precious even without a price","Every map must point to gold","Photographs are made of silver","Only old things have value","Ari realizes the objects matter because they connect him to family experiences."],"vocab":["faded","less clear or bright than before","brand-new and shiny","very difficult to carry","completely hidden underground"],"concepts":[["map","tree","tin"],["photographs","postcards","family"],["treasure","memories","value"]]},{"level":4,"title":"The Lantern in the Storm","genre":"Literary","paragraphs":["Wind rattled the windows as Leena’s family waited for a storm to pass. Through the rain, Leena could see a small lantern glowing on the porch of the house across the street.","The neighbor had promised to leave the lantern on so people walking home could find the steps in the dark. Its light was not strong enough to stop the storm, but it marked a steady point in the shifting shadows.","Leena thought that the lantern looked like a tiny promise: even when weather was frightening, someone had remembered to help others. To Leena, the lantern was a symbol of someone caring for others."],"main":"A lantern becomes a symbol of reliable care during a storm.","detail":["Where was the lantern placed?","On a neighbor’s porch","In the school hallway","At the bottom of a river","Inside a library drawer","The lantern shone from the porch across the street."],"cause":["Why did the neighbor leave the lantern lit?","To help people see the steps at night","To warm the entire street","To make the storm stop sooner","To attract birds to the porch","Its light helped walkers locate the steps safely."],"infer":["What does the lantern symbolize for Leena?","A person’s care and dependability","A warning that no one is home","A wish for more thunder","A sign that the street has no houses","The steady light stands for someone keeping a promise to help."],"vocab":["symbol","something that represents a larger idea","a kind of electric battery","a tool for cutting paper","a place where storms begin"],"concepts":[["lantern","porch","light"],["storm","rain","dark"],["promise","care","help"]]},{"level":4,"title":"The Race Nobody Won","genre":"Literary","paragraphs":["Four students trained for a relay race at field day. Just before the start, one teammate slipped on damp grass and hurt an ankle. The remaining runners looked toward the track while their teammate sat beside the teacher.","Instead of entering with only three students, the group helped carry water and equipment for the other runners. Later, they cheered for every team at the finish line.","They went home without a ribbon, but one student said the day still felt like a victory because no one had been left alone."],"main":"Teamwork can mean caring for a teammate rather than winning a race.","detail":["What prevented the team from starting the relay?","A teammate hurt an ankle","The relay batons disappeared","The race was held at night","No students had practiced","One runner slipped and injured an ankle just before the start."],"cause":["Why did the students help other runners?","They chose to contribute even though they could not race","They wanted to hide the finish line","They were told to leave the field","They no longer cared about classmates","Helping with equipment and cheering let them take part positively."],"infer":["Why did the day feel like a victory to one student?","The team showed loyalty and kindness","They secretly earned the first-place ribbon","The race was canceled for everyone","No one crossed the finish line","The team valued supporting each other over a prize."],"vocab":["victory","a success or achievement","a type of running shoe","a loud whistle","a small glass bottle"],"concepts":[["relay","race","teammate"],["ankle","injury","help"],["teamwork","loyal","victory"]]},{"level":4,"title":"The Painting on the Wall","genre":"Literary","paragraphs":["A new mural was painted beside the school garden. It showed a blue river winding through green hills, with children planting trees beside its banks. Students stopped on their way to class to look at the bright colors.","Ms. Rivera asked what message the painter might have wanted to share. Some students said the painting celebrated nature. Others pointed to the children’s shovels and argued that it encouraged people to care for the
